<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freemasonry Heritage | Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-dark:#b8941f;--dark:#07111f;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:var(--dark);color:white;min-height:100vh;}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(7,17,31,.88), rgba(7,17,31,.95)),url("1517026394531.jpeg");background-size:cover;background-position:center;background-attachment:fixed;z-index:-2;}
body::after{content:"◬";position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:400px;color:rgba(212,175,55,.03);z-index:-1;pointer-events:none;}
header{position:fixed;top:0;left:0;width:100%;padding:18px 5%;background:rgba(0,0,0,.85);backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;z-index:1000;border-bottom:1px solid rgba(212,175,55,.2);}
.logo{font-size:24px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;}
.logout{background:var(--gold);color:#111;padding:8px 20px;border-radius:30px;text-decoration:none;font-weight:600;transition:.3s;border:none;cursor:pointer;font-size:14px;}
.logout:hover{background:var(--gold-dark);transform:translateY(-2px);}
.container{padding:120px 5% 50px;max-width:1400px;margin:auto;}
.page-header{text-align:center;margin-bottom:30px;}
.page-header.fraternity-name{font-size:14px;color:#ccc;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}
.page-header h1{font-size:36px;color:var(--gold);font-family:'Playfair Display',serif;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:30px;}
.stat-card{background:linear-gradient(145deg,rgba(20,34,56,.9),rgba(11,23,40,.9));backdrop-filter:blur(20px);padding:20px;border-radius:16px;text-align:center;border:1px solid rgba(212,175,55,.25);}
.stat-card h2{color:var(--gold);font-size:32px;font-family:'Playfair Display',serif}

/* ADDED: Maintenance Section at bottom */
.maintenance-section{margin-top:60px;padding:30px;border-radius:16px;background:linear-gradient(145deg,rgba(20,34,56,.9),rgba(11,23,40,.9));border:1px solid rgba(212,175,55,.25);text-align:center;}
.maintenance-section h3{color:var(--gold);font-size:22px;margin-bottom:20px;font-family:'Playfair Display',serif;}
.maintenance-buttons{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.maint-btn{padding:12px 35px;border-radius:30px;border:2px solid var(--gold);background:transparent;color:var(--gold);font-weight:600;font-size:16px;cursor:pointer;transition:.3s;min-width:140px;}
.maint-btn:hover{background:var(--gold);color:#111;transform:translateY(-2px);}
.maint-btn.active{background:var(--success);border-color:var(--success);color:white;}
.maint-btn.active.danger{background:var(--danger);border-color:var(--danger);}

/* ADDED: Maintenance Overlay */
.maintenance-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(7,17,31,.98);backdrop-filter:blur(20px);z-index:9999;display:none;justify-content:center;align-items:center;flex-direction:column;text-align:center;padding:20px;}
.maintenance-overlay.active{display:flex;}
.maintenance-icon{font-size:80px;color:var(--gold);margin-bottom:20px;animation:pulse 2s infinite;}
.maintenance-title{font-size:42px;color:var(--gold);font-family:'Playfair Display',serif;margin-bottom:15px;}
.maintenance-text{font-size:18px;color:#ccc;max-width:500px;line-height:1.8;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
</style>
</head>
<body>

<!-- MAINTENANCE OVERLAY - Only shows to public -->
<div class="maintenance-overlay" id="maintenanceOverlay">
  <div class="maintenance-icon">◬</div>
  <h1 class="maintenance-title">Under Maintenance</h1>
  <p class="maintenance-text">The Freemasonry Heritage site is currently undergoing scheduled maintenance. Please check back later.</p>
</div>

<header>
  <div class="logo">Freemasonry Heritage</div>
  <button class="logout">Logout</button>
</header>

<div class="container">
  <div class="page-header">
    <div class="fraternity-name">Mansory Family Fraternity</div>
    <h1>Admin Panel</h1>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <h2>128</h2>
      <p>Total Members</p>
    </div>
    <div class="stat-card">
      <h2>24</h2>
      <p>New Applications</p>
    </div>
  </div>

  <!-- ADDED: Maintenance Buttons at the END -->
  <div class="maintenance-section">
    <h3>Maintenance Mode</h3>
    <div class="maintenance-buttons">
      <button class="maint-btn" id="maintenanceOn">Maintenance<br>On</button>
      <button class="maint-btn" id="maintenanceOff">Maintenance<br>Off</button>
    </div>
  </div>

</div>

<script>
// MAINTENANCE LOGIC
const overlay = document.getElementById('maintenanceOverlay');
const btnOn = document.getElementById('maintenanceOn');
const btnOff = document.getElementById('maintenanceOff');

// Admin is never blocked
const isAdmin = true; 

function checkMaintenance() {
  const isMaintenance = localStorage.getItem('maintenanceMode') === 'true';
  
  if(isMaintenance && !isAdmin) {
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  } else {
    overlay.classList.remove('active');
    document.body.style.overflow = 'auto';
  }
  
  // Update button styles
  if(isMaintenance) {
    btnOn.classList.add('active');
    btnOff.classList.remove('active','danger');
  } else {
    btnOff.classList.add('active','danger');
    btnOn.classList.remove('active');
  }
}

btnOn.addEventListener('click', () => {
  localStorage.setItem('maintenanceMode', 'true');
  checkMaintenance();
  toast('Maintenance Mode: ON');
});

btnOff.addEventListener('click', () => {
  localStorage.setItem('maintenanceMode', 'false');
  checkMaintenance();
  toast('Maintenance Mode: OFF');
});

// Toast in center
function toast(message) {
  const t = document.createElement('div');
  t.textContent = message;
  t.style.cssText = `
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:var(--gold);color:#111;padding:18px 35px;border-radius:12px;
    font-weight:600;font-size:16px;z-index:10000;box-shadow:0 10px 40px rgba(212,175,55,.4);
    animation:fadeInOut 2.5s forwards;
  `;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

const style = document.createElement('style');
style.innerHTML = `@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-60%);}20%{opacity:1;transform:translate(-50%,-50%);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-40%);}}`;
document.head.appendChild(style);

checkMaintenance();
</script>

</body>
</html>
