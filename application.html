<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freemasonry Heritage</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-dark:#b8941f;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#07111f;color:white;min-height:100vh;padding-bottom:120px;}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(7,17,31,.85), rgba(7,17,31,.92)),url("1517026394531.jpeg");background-size:cover;background-position:center;z-index:-2;}
header{position:fixed;top:0;left:0;width:100%;padding:16px 6%;background:rgba(0,0,0,.85);backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;z-index:1000;border-bottom:1px solid rgba(212,175,55,.2);}
.logo{font-size:24px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;}
.logout{background:var(--gold);color:#111;padding:8px 22px;border-radius:30px;text-decoration:none;font-weight:700;font-size:14px;}
.container{padding:110px 4% 40px;max-width:600px;margin:auto;}
.form-card{background:linear-gradient(180deg, #14372e 0%, #0f2f28 100%);border-radius:28px;padding:26px 20px;border:1px solid rgba(212,175,55,.18);box-shadow:0 15px 40px rgba(0,0,0,.4);}
.section{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid rgba(212,175,55,.12);}
.section:last-child{border-bottom:none;}
.section-title{font-size:19px;color:var(--gold);margin-bottom:22px;font-weight:700;line-height:1.3;display:block;}
.form-grid{display:flex;flex-direction:column;gap:16px;}
.form-group{display:flex;flex-direction:column;gap:7px;}
.form-group label{color:#cbd5d3;font-size:13px;}
.form-group input,.form-group select{width:100%;background:#0a1e2a;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;color:white;font-size:14px;outline:none;}
.phone-wrapper{display:flex;gap:10px;}
.phone-wrapper select{width:90px;min-width:90px;}
.phone-wrapper input{flex:1;}
.btn-submit{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#111;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:#121D33;padding:24px 30px;border-radius:18px;border:2px solid var(--gold);z-index:9999;opacity:0;transition:.35s;text-align:center;min-width:280px;}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.bottom-nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:rgba(15,26,46,.96);padding:8px;border-radius:20px;display:flex;gap:6px;border:1px solid rgba(212,175,55,.25);z-index:2000;width:calc(100% - 20px);max-width:600px;justify-content:space-between;}
.nav-item{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#a0b0c9;border-radius:14px;font-size:9px;}
.nav-icon{width:22px;height:22px;margin-bottom:4px;fill:currentColor;}
.nav-item.active{background:linear-gradient(135deg,#d4af37,#b8941f);color:#111;font-weight:700;}
</style>
</head>
<body>
<div id="toast" class="toast"><span id="toastIcon"></span><span id="toastMessage"></span></div>
<header><div class="logo">Freemasonry Heritage</div><a href="#" class="logout" data-i18n="logout">Logout</a></header>
<main class="container">
<form class="form-card" id="applicationForm">
<div class="section">
<h2 class="section-title" data-i18n="personal">Personal Details</h2>
<div class="form-grid">
<div class="form-group"><label data-i18n="full_name">Full Name *</label><input type="text" id="fullName" required></div>
<div class="form-group"><label data-i18n="dob">Date of Birth *</label><input type="date" id="dob" required></div>
<div class="form-group"><label data-i18n="id_num">ID Number *</label><input type="text" id="idNumber" required></div>
<div class="form-group"><label data-i18n="gender">Gender *</label><select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option></select></div>
<div class="form-group"><label data-i18n="birth_town">Birth Town *</label><input type="text" id="birthTown" required></div>
<div class="form-group"><label data-i18n="nickname">Nickname</label><input type="text" id="nickname"></div>
<div class="form-group"><label data-i18n="country">Country *</label><select id="country" required><option value="">Select Country</option><option value="Kenya">🇰🇪 Kenya</option><option value="Uganda">🇺🇬 Uganda</option><option value="Tanzania">🇹🇿 Tanzania</option><option value="Rwanda">🇷🇼 Rwanda</option><option value="DRC">🇨🇩 DRC</option><option value="South Africa">🇿🇦 South Africa</option><option value="Nigeria">🇳🇬 Nigeria</option><option value="Ghana">🇬🇭 Ghana</option><option value="USA">🇺🇸 USA</option><option value="UK">🇬🇧 UK</option><option value="Other">Other</option></select></div>
<div class="form-group"><label data-i18n="phone">Phone Number *</label><div class="phone-wrapper"><select id="countryCode" required><option value="">Code</option><option value="+254">+254</option><option value="+256">+256</option><option value="+255">+255</option><option value="+250">+250</option><option value="+243">+243</option><option value="+27">+27</option><option value="+234">+234</option><option value="+233">+233</option><option value="+1">+1</option><option value="+44">+44</option></select><input type="tel" id="phone" placeholder="712345678" required></div></div>
</div>
</div>
<div class="section">
<h2 class="section-title" data-i18n="business">Business Information</h2>
<div class="form-grid">
<div class="form-group"><label data-i18n="business_type">Type of Business *</label><input type="text" id="businessType" required></div>
<div class="form-group"><label data-i18n="business_loc">Business Location *</label><input type="text" id="businessLocation" required></div>
</div>
</div>
<div class="section">
<h2 class="section-title" data-i18n="lodge">Lodge Preference</h2>
<div class="form-grid">
<div class="form-group"><label data-i18n="nearest">Nearest Lodge *</label><input type="text" id="nearestLodge" required></div>
</div>
<button type="submit" class="btn-submit" id="submitBtn" data-i18n="submit">Submit Application</button>
</div>
</form>
</main>
<nav class="bottom-nav">
<a href="dashboard.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span data-i18n="home">Home</span></a>
<a href="requirements.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg><span data-i18n="req">Requirements</span></a>
<a href="application.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg><span data-i18n="app">Application</span></a>
<a href="member.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span data-i18n="members">Members</span></a>
<a href="help.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.39-1.11-.59-2.28-.59-3.53 0-.55-.45-1-1-1H4c-.55 0-1.45-1 1 0 9.39 7.61 17 17 17.55 0 1-.45 1-1v-3.49c0-.55-.45-1-1-1z"/></svg><span data-i18n="help">Helpline</span></a>
<a href="laws.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2.9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg><span data-i18n="laws">Laws</span></a>
</nav>
<script>
const T={
en:{logout:"Logout",home:"Home",req:"Requirements",app:"Application",members:"Members",help:"Helpline",laws:"Laws",personal:"Personal Details",full_name:"Full Name *",dob:"Date of Birth *",id_num:"ID Number *",gender:"Gender *",birth_town:"Birth Town *",nickname:"Nickname",country:"Country *",phone:"Phone Number *",business:"Business Information",business_type:"Type of Business *",business_loc:"Business Location *",lodge:"Lodge Preference",nearest:"Nearest Lodge *",submit:"Submit Application",update:"Update Application"},
sw:{logout:"Toka",home:"Nyumbani",req:"Mahitaji",app:"Maombi",members:"Wanachama",help:"Msaada",laws:"Sheria",personal:"Maelezo Binafsi",full_name:"Jina Kamili *",dob:"Tarehe ya Kuzaliwa *",id_num:"Nambari ya Kitambulisho *",gender:"Jinsia *",birth_town:"Mji wa Kuzaliwa *",nickname:"Jina la Utani",country:"Nchi *",phone:"Nambari ya Simu *",business:"Taarifa za Biashara",business_type:"Aina ya Biashara *",business_loc:"Mahali pa Biashara *",lodge:"Upendeleo wa Lodge",nearest:"Lodge ya Karibu *",submit:"Tuma Maombi",update:"Sasisha Maombi"},
lg:{logout:"Fuluma",home:"Awaka",req:"Ebyetaago",app:"Okusaba",members:"Bammemba",help:"Obuyambi",laws:"Amateeka",personal:"Ebikukwatako",full_name:"Amannya Goonna *",dob:"Ennaku z'Amazaalibwa *",id_num:"Namba ya ID *",gender:"Ekikula *",birth_town:"Kibuga ky'Amazaalibwa *",nickname:"Erinnya Ery'ekisa",country:"Ensi *",phone:"Namba y'Essimu *",business:"Ebikwata ku Bizinensi",business_type:"Ekika kya Bizinensi *",business_loc:"Bizinesi Esangibwa Wa *",lodge:"Lodge Gy'oyagala",nearest:"Lodge Esinga Okumpi *",submit:"Weereza Okusaba",update:"Kyusa Okusaba"}
};
function lang(){return localStorage.getItem('siteLang')||'en';}
function tr(k){const l=lang();return (T[l]&&T[l][k])||T.en[k]||k;}
function apply(){document.querySelectorAll('[data-i18n]').forEach(e=>e.innerText=tr(e.dataset.i18n));}
document.addEventListener('DOMContentLoaded',apply);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",authDomain:"mansonry-family-fraternity.firebaseapp.com",databaseURL:"https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",projectId:"mansonry-family-fraternity",storageBucket:"mansonry-family-fraternity.firebasestorage.app",messagingSenderId:"964415179161",appId:"1:964415179161:web:c8fd1a777542932d7c6b08"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);
let currentUser=null;let isEdit=false;let existingStatus="pending";
const form=document.getElementById("applicationForm");const submitBtn=document.getElementById("submitBtn");const countrySelect=document.getElementById("country");const countryCodeSelect=document.getElementById("countryCode");const toast=document.getElementById("toast");
const countryToCode={"Kenya":"+254","Uganda":"+256","Tanzania":"+255","Rwanda":"+250","DRC":"+243","South Africa":"+27","Nigeria":"+234","Ghana":"+233","USA":"+1","UK":"+44"};
countrySelect.addEventListener("change",()=>{if(countryToCode[countrySelect.value]){countryCodeSelect.value=countryToCode[countrySelect.value];}});
function showToast(t,m){toast.className=`toast ${t} show`;toast.querySelector('#toastIcon').textContent=t==='success'?'✓':'✕';toast.querySelector('#toastMessage').textContent=m;setTimeout(()=>toast.classList.remove('show'),3000);}
function fillForm(d){fullName.value=d.fullName||'';dob.value=d.dob||'';idNumber.value=d.idNumber||'';gender.value=d.gender||'';birthTown.value=d.birthTown||'';nickname.value=d.nickname||'';businessType.value=d.businessType||'';businessLocation.value=d.businessLocation||'';nearestLodge.value=d.nearestLodge||'';country.value=d.country||'';countryCode.value=d.countryCode||'';phone.value=d.phoneNumber||'';existingStatus=d.status||"pending";isEdit=true;submitBtn.textContent=tr('update');}
onAuthStateChanged(auth,async(u)=>{if(u){currentUser=u;const s=await get(ref(db,"applications/"+u.uid));if(s.exists())fillForm(s.val());}else location.href="login.html";});
form.addEventListener("submit",async(e)=>{e.preventDefault();if(!currentUser)return showToast('error','Login first');submitBtn.disabled=true;submitBtn.textContent=isEdit?"Updating...":"Submitting...";const data={fullName:fullName.value.trim(),dob:dob.value,idNumber:idNumber.value.trim(),gender:gender.value,birthTown:birthTown.value.trim(),nickname:nickname.value.trim(),country:country.value,countryCode:countryCode.value,phoneNumber:phone.value.trim(),phone:countryCode.value+phone.value.trim(),businessType:businessType.value.trim(),businessLocation:businessLocation.value.trim(),nearestLodge:nearestLodge.value.trim(),status:existingStatus,submittedBy:currentUser.uid,updatedAt:serverTimestamp()};try{await set(ref(db,"applications/"+currentUser.uid),data);showToast('success',isEdit?'Application Updated!':'Application Submitted!');setTimeout(()=>location.href="help.html",1200);}catch(err){showToast('error',err.message);submitBtn.disabled=false;}});
document.querySelector(".logout").addEventListener("click",(e)=>{e.preventDefault();signOut(auth).then(()=>location.href="login.html");});
</script>
</body>
</html>
