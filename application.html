<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freemasonry Heritage | Membership Application</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-dark:#b8941f;--dark:#07111f;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:var(--dark);color:white;min-height:100vh;padding-bottom:120px;overflow-x:hidden;}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(7,17,31,.88), rgba(7,17,31,.95)),url("1517026394531.jpeg");background-size:cover;background-position:center;background-attachment:fixed;z-index:-2;}
header{position:fixed;top:0;left:0;width:100%;padding:20px 8%;background:rgba(0,0,0,.8);backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;z-index:1000;border-bottom:1px solid rgba(212,175,55,.2);}
.logo{font-size:28px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;}
.logout{background:var(--gold);color:#111;padding:10px 25px;border-radius:30px;text-decoration:none;font-weight:600;}
.container{padding:140px 8% 50px;max-width:1000px;margin:auto;width:100%;box-sizing:border-box;}
.fraternity-header{text-align:center;margin-bottom:50px;}
.fraternity-header h1{font-size:48px;color:var(--gold);font-family:'Playfair Display',serif;}
.form-card{background:linear-gradient(145deg,rgba(20,34,56,.9),rgba(11,23,40,.9));backdrop-filter:blur(20px);border-radius:25px;padding:45px;border:1px solid rgba(212,175,55,.25);width:100%;max-width:100%;box-sizing:border-box;overflow:hidden;}
.form-card.submitted{border-color:#4cff88;}
.section{margin-bottom:45px;padding-bottom:35px;border-bottom:1px solid rgba(212,175,55,.15);}
.section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.section-title{font-size:24px;color:var(--gold);margin-bottom:25px;font-weight:600;}

/* FIXED - NO MORE LONG CARD + NO CUT */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:start;width:100%;}
.form-group{display:flex;flex-direction:column;align-self:start;min-width:0;overflow:hidden;width:100%;}
.form-group label{color:#ccc;font-size:14px;margin-bottom:8px;}
.form-group input,.form-group select{width:100%;max-width:100%;background:#08111f;border:1px solid rgba(212,175,55,.25);border-radius:12px;padding:14px 18px;color:white;font-size:15px;outline:none;height:50px;box-sizing:border-box;min-width:0;}
.form-group input:focus,.form-group select:focus{border-color:var(--gold);}

/* PHONE FIX - THIS WAS CUTTING IN YOUR SCREENSHOT */
.phone-wrapper{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:10px;
  width:100%;
  max-width:100%;
}
.phone-wrapper select{
  width:100%!important;
  min-width:0!important;
  padding:14px 10px;
}
.phone-wrapper input{
  width:100%!important;
  min-width:0!important;
}

.btn-submit{width:100%;padding:18px;border:none;border-radius:15px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#111;font-size:18px;font-weight:700;cursor:pointer;margin-top:30px;}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:rgba(20,34,56,.98);padding:30px 40px;border-radius:18px;border:2px solid var(--gold);z-index:9999;opacity:0;transition:.4s;text-align:center;min-width:320px;}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.toast.success{border-color:#4cff88;}.toast.error{border-color:#ff5555;}

@media(max-width:600px){
 .form-grid{grid-template-columns:1fr;}
 .phone-wrapper{grid-template-columns:95px 1fr;gap:8px;}
 .container{padding:120px 4% 50px;}
 .form-card{padding:25px 16px;border-radius:18px;}
 .fraternity-header h1{font-size:28px;}
  header{padding:15px 4%;}
 .logo{font-size:20px;}
}
</style>
</head>
<body>
<div id="toast" class="toast"><span class="icon" id="toastIcon"></span><span class="message" id="toastMessage"></span></div>
<header>
<div class="logo">Freemasonry Heritage</div>
<div style="display:flex;align-items:center;gap:12px;position:relative;">
<button id="langBtn" style="background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);width:42px;height:42px;border-radius:50%;cursor:pointer;color:#d4af37;font-size:20px;display:flex;align-items:center;justify-content:center;">🌐</button>
<div id="langMenu" style="display:none;position:absolute;top:55px;right:110px;background:#0f1a2e;border:1px solid rgba(212,175,55,.3);border-radius:12px;padding:8px;z-index:2000;min-width:180px;box-shadow:0 10px 30px rgba(0,0,0,.5);"></div>
<a href="#" class="logout" data-i18n="logout">Logout</a>
</div>
</header>
<main class="container">
<div class="fraternity-header"><h1 data-i18n="app_title">Membership Application Form</h1></div>
<form class="form-card" id="applicationForm">
<div class="section">
<h2 class="section-title" data-i18n="personal">Personal Details</h2>
<div class="form-grid">
<div class="form-group"><label data-i18n="full_name">Full Name *</label><input type="text" id="fullName" required></div>
<div class="form-group"><label data-i18n="dob">Date of Birth *</label><input type="date" id="dob" required></div>
<div class="form-group"><label data-i18n="id_num">ID Number *</label><input type="text" id="idNumber" required></div>
<div class="form-group"><label data-i18n="gender">Gender *</label><select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option></select></div>
<div class="form-group"><label data-i18n="birth_town">Birth Town *</label><input type="text" id="birthTown" required></div>
<div class="form-group"><label data-i18n="nickname">Nickname</label><input type="text" id="nickname"></div>
<div class="form-group">
<label data-i18n="country">Country *</label>
<select id="country" required>
<option value="">Select Country</option>
<option value="Kenya">🇰🇪 Kenya</option>
<option value="Uganda">🇺🇬 Uganda</option>
<option value="Tanzania">🇹🇿 Tanzania</option>
<option value="Rwanda">🇷🇼 Rwanda</option>
<option value="Guinea-Bissau">🇬🇼 Guinea-Bissau</option>
<option value="DRC">🇨🇩 DRC</option>
<option value="South Africa">🇿🇦 South Africa</option>
<option value="Nigeria">🇳🇬 Nigeria</option>
<option value="Ghana">🇬🇭 Ghana</option>
<option value="Ethiopia">🇪🇹 Ethiopia</option>
<option value="Zimbabwe">🇿🇼 Zimbabwe</option>
<option value="Zambia">🇿🇲 Zambia</option>
<option value="Botswana">🇧🇼 Botswana</option>
<option value="Namibia">🇳🇦 Namibia</option>
<option value="USA">🇺🇸 USA</option>
<option value="Canada">🇨🇦 Canada</option>
<option value="UK">🇬🇧 UK</option>
<option value="Australia">🇦🇺 Australia</option>
<option value="India">🇮🇳 India</option>
<option value="Other">Other</option>
</select>
</div>
<div class="form-group">
<label data-i18n="phone">Phone Number *</label>
<div class="phone-wrapper">
<select id="countryCode" required>
<option value="">Code</option>
<option value="+254">+254</option>
<option value="+256">+256</option>
<option value="+255">+255</option>
<option value="+250">+250</option>
<option value="+245">+245</option>
<option value="+243">+243</option>
<option value="+27">+27</option>
<option value="+234">+234</option>
<option value="+233">+233</option>
<option value="+251">+251</option>
<option value="+263">+263</option>
<option value="+260">+260</option>
<option value="+267">+267</option>
<option value="+264">+264</option>
<option value="+1">+1</option>
<option value="+44">+44</option>
<option value="+61">+61</option>
<option value="+91">+91</option>
</select>
<input type="tel" id="phone" placeholder="712345678" required pattern="[0-9]{7,15}">
</div>
</div>
</div>
</div>
<div class="section">
<h2 class="section-title" data-i18n="business">Business Information</h2>
<div class="form-grid">
<div class="form-group"><label data-i18n="business_type">Type of Business *</label><input type="text" id="businessType" required></div>
<div class="form-group"><label data-i18n="business_loc">Business Location *</label><input type="text" id="businessLocation" required></div>
</div>
</div>
<div class="section">
<h2 class="section-title" data-i18n="lodge">Lodge Preference</h2>
<div class="form-group"><label data-i18n="nearest">Nearest Lodge *</label><input type="text" id="nearestLodge" required></div>
</div>
<button type="submit" class="btn-submit" id="submitBtn" data-i18n="submit">Submit Application</button>
</form>
</main>
<script>
const LANG_NAMES={en:"English",sw:"Kiswahili",lg:"Luganda",rw:"Kinyarwanda",pt:"Português",fr:"Français",zu:"Zulu",ha:"Hausa",tw:"Twi",am:"Amharic",sn:"Shona",bem:"Bemba",tn:"Setswana",ng:"Oshiwambo",hi:"Hindi"};
const COUNTRY_LANGS_MAP={"Kenya":["en","sw"],"Uganda":["en","sw","lg"],"Tanzania":["sw","en"],"Rwanda":["en","sw","rw"],"Guinea-Bissau":["en","pt"],"DRC":["en","sw","fr"],"South Africa":["en","zu"],"Nigeria":["en","ha"],"Ghana":["en","tw"],"Ethiopia":["en","am"],"Zimbabwe":["en","sn"],"Zambia":["en","bem"],"Botswana":["en","tn"],"Namibia":["en","ng"],"USA":["en"],"Canada":["en","fr"],"UK":["en"],"Australia":["en"],"India":["en","hi"],"Other":["en","sw"]};
const T={en:{logout:"Logout",app_title:"Membership Application Form",personal:"Personal Details",full_name:"Full Name *",dob:"Date of Birth *",id_num:"ID Number *",gender:"Gender *",birth_town:"Birth Town *",nickname:"Nickname",country:"Country *",phone:"Phone Number *",business:"Business Information",business_type:"Type of Business *",business_loc:"Business Location *",lodge:"Lodge Preference",nearest:"Nearest Lodge *",submit:"Submit Application",update:"Update Application"},sw:{logout:"Toka",app_title:"Fomu ya Maombi ya Uanachama",personal:"Maelezo Binafsi",full_name:"Jina Kamili *",dob:"Tarehe ya Kuzaliwa *",id_num:"Nambari ya Kitambulisho *",gender:"Jinsia *",birth_town:"Mji wa Kuzaliwa *",nickname:"Jina la Utani",country:"Nchi *",phone:"Nambari ya Simu *",business:"Taarifa za Biashara",business_type:"Aina ya Biashara *",business_loc:"Mahali pa Biashara *",lodge:"Upendeleo wa Lodge",nearest:"Lodge ya Karibu *",submit:"Tuma Maombi",update:"Sasisha Maombi"},lg:{logout:"Fuluma",app_title:"Fomu y'Okusaba Obwammemba",personal:"Ebikukwatako",full_name:"Amannya Goonna *",dob:"Ennaku z'Amazaalibwa *",id_num:"Namba ya ID *",gender:"Ekikula *",birth_town:"Kibuga ky'Amazaalibwa *",nickname:"Erinnya Ery'ekisa",country:"Ensi *",phone:"Namba y'Essimu *",business:"Ebikwata ku Bizinensi",business_type:"Ekika kya Bizinensi *",business_loc:"Bizinesi Esangibwa Wa *",lodge:"Lodge Gy'oyagala",nearest:"Lodge Esinga Okumpi *",submit:"Weereza Okusaba",update:"Kyusa Okusaba"}};
function getLang(){return localStorage.getItem('siteLang')||'en';}
function setLang(l){localStorage.setItem('siteLang',l);applyLang();document.getElementById('langMenu').style.display='none';}
function applyLang(){const lang=getLang();const dict=T[lang]||T.en;document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.dataset.i18n; if(dict[k]) e.innerText=dict[k];});document.querySelectorAll('#langMenu div').forEach(d=>{d.style.background=d.dataset.lang===lang?'#d4af37':'transparent'; d.style.color=d.dataset.lang===lang?'#111':'#a0b0c9';});}
function buildLangMenuForCountry(country){const langs=COUNTRY_LANGS_MAP[country]||["en","sw"];const menu=document.getElementById('langMenu');menu.innerHTML='';langs.forEach(l=>{const div=document.createElement('div');div.dataset.lang=l;div.textContent=LANG_NAMES[l]||l;div.style.cssText='padding:10px 14px;cursor:pointer;border-radius:8px;margin-bottom:4px;font-size:13px;';div.onclick=()=>setLang(l);menu.appendChild(div);});applyLang();}
document.getElementById('langBtn').onclick=(e)=>{e.stopPropagation();const m=document.getElementById('langMenu');m.style.display=m.style.display==='none'?'block':'none';};
document.addEventListener('click',()=>{document.getElementById('langMenu').style.display='none';});
document.getElementById('country').addEventListener('change',function(){buildLangMenuForCountry(this.value);});
(function initLang(){buildLangMenuForCountry(document.getElementById('country').value||'Other'); applyLang();})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {apiKey:"AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",authDomain:"mansonry-family-fraternity.firebaseapp.com",databaseURL:"https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",projectId:"mansonry-family-fraternity",storageBucket:"mansonry-family-fraternity.firebasestorage.app",messagingSenderId:"964415179161",appId:"1:964415179161:web:c8fd1a777542932d7c6b08"};
const app = initializeApp(firebaseConfig);const auth = getAuth(app);const database = getDatabase(app);
let currentUser=null;let isEditMode=false;let existingStatus="pending";
const form=document.getElementById("applicationForm");const submitBtn=document.getElementById("submitBtn");const countrySelect=document.getElementById("country");const countryCodeSelect=document.getElementById("countryCode");const toast=document.getElementById("toast");const toastIcon=document.getElementById("toastIcon");const toastMessage=document.getElementById("toastMessage");
const countryToCode={"Kenya":"+254","Uganda":"+256","Tanzania":"+255","Rwanda":"+250","Guinea-Bissau":"+245","DRC":"+243","South Africa":"+27","Nigeria":"+234","Ghana":"+233","Ethiopia":"+251","Zimbabwe":"+263","Zambia":"+260","Botswana":"+267","Namibia":"+264","USA":"+1","Canada":"+1","UK":"+44","Australia":"+61","India":"+91"};
countrySelect.addEventListener("change",()=>{if(countryToCode[countrySelect.value]){countryCodeSelect.value=countryToCode[countrySelect.value];}});
function showToast(type,message){toast.className=`toast ${type} show`;toastIcon.textContent=type==='success'?'✓':'✕';toastMessage.textContent=message;setTimeout(()=>{toast.classList.remove('show');},3000);}
function fillForm(data){document.getElementById('fullName').value=data.fullName||'';document.getElementById('dob').value=data.dob||'';document.getElementById('idNumber').value=data.idNumber||'';document.getElementById('gender').value=data.gender||'';document.getElementById('birthTown').value=data.birthTown||'';document.getElementById('nickname').value=data.nickname||'';document.getElementById('businessType').value=data.businessType||'';document.getElementById('businessLocation').value=data.businessLocation||'';document.getElementById('nearestLodge').value=data.nearestLodge||'';document.getElementById('country').value=data.country||'';document.getElementById('countryCode').value=data.countryCode||'';document.getElementById('phone').value=data.phoneNumber||'';existingStatus=data.status||"pending";isEditMode=true;submitBtn.textContent=(localStorage.getItem('siteLang')==='sw'?'Sasisha Maombi':localStorage.getItem('siteLang')==='lg'?'Kyusa Okusaba':'Update Application');form.classList.add('submitted');if(data.country) buildLangMenuForCountry(data.country);}
onAuthStateChanged(auth,async(user)=>{if(user){currentUser=user;const snapshot=await get(ref(database,"applications/"+user.uid));if(snapshot.exists()){fillForm(snapshot.val());}}else{window.location.href="login.html";}});
form.addEventListener("submit",async(e)=>{e.preventDefault();if(!currentUser)return showToast('error','Please login first');submitBtn.disabled=true;submitBtn.textContent=isEditMode?"Updating...":"Submitting...";const country=document.getElementById('country').value;const countryCode=document.getElementById('countryCode').value;const phoneNumber=document.getElementById('phone').value.trim();const applicationData={fullName:document.getElementById('fullName').value.trim(),dob:document.getElementById('dob').value,idNumber:document.getElementById('idNumber').value.trim(),gender:document.getElementById('gender').value,birthTown:document.getElementById('birthTown').value.trim(),nickname:document.getElementById('nickname').value.trim(),country,countryCode,phoneNumber,phone:countryCode+phoneNumber,businessType:document.getElementById('businessType').value.trim(),businessLocation:document.getElementById('businessLocation').value.trim(),nearestLodge:document.getElementById('nearestLodge').value.trim(),status:existingStatus,submittedBy:currentUser.uid,updatedAt:serverTimestamp(),preferredLang:localStorage.getItem('siteLang')||'en',availableLangs:COUNTRY_LANGS_MAP[country]||["en","sw"]};try{await set(ref(database,"applications/"+currentUser.uid),applicationData);showToast('success',isEditMode?'Application Updated!':'Application Submitted!');form.classList.add('submitted');setTimeout(()=>{window.location.href="help.html";},1500);}catch(error){showToast('error','Save Failed: '+error.message);submitBtn.disabled=false;}});
document.querySelector(".logout").addEventListener("click",(e)=>{e.preventDefault();signOut(auth).then(()=>{window.location.href="login.html";});});
</script>
</body>
</html>
