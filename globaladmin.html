<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL ADMIN PANEL</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#080E1F;--card:#121D33;--border:#1E2E4F;--gold:#D4B16A;--gold2:#F0D185;--green:#00ff88}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:12px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#membersList{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column}
.member-item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin:6px 0;cursor:pointer;position:relative}
.member-item.new-msg{border:2px solid var(--green);background:linear-gradient(145deg,#0f2a1f,#121D33)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--green);color:#000;font-size:11px;font-weight:900;min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bg)}
#chatPage{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;background:#080E1F;gap:3px}
.msg-wrap{position:relative;width:100%;display:flex;align-items:center}
.reply-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%) scale(0.6);width:32px;height:32px;background:var(--gold);border-radius:50%;display:grid;place-items:center;color:#000;opacity:0;transition:all.2s ease;z-index:1}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;margin:4px 0;font-size:13px;cursor:pointer;transition:transform.22s ease;will-change:transform;position:relative;z-index:2;touch-action:pan-y;user-select:none}
.msg.swiping{transition:none}
.my-msg{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000;margin-left:auto;align-self:flex-end}
.other-msg{background:var(--card);border:1px solid var(--border);margin-right:auto;align-self:flex-start}
.reply-preview{border-left:3px solid var(--gold);background:rgba(212,177,106,.15);padding:6px 8px;border-radius:6px;margin-bottom:6px;font-size:11px}
.reply-bar{background:#0A1428;border-left:3px solid var(--gold);padding:8px 10px;display:none;justify-content:space-between;align-items:center}
.input-area{background:var(--card);border-top:1px solid var(--border);padding:8px;display:flex;gap:8px;align-items:center}
.input-area input{flex:1;background:#0A1428;border:1px solid var(--border);color:#fff;padding:11px;border-radius:20px;outline:none}
.icon-btn{background:var(--gold);color:#000;width:42px;height:42px;border-radius:50%;border:none;display:grid;place-items:center}
.menu{position:fixed;z-index:100;background:#1a2a4a;border:1px solid var(--gold);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.8)}
.menu button{background:var(--card);border:1px solid var(--border);color:#fff;padding:11px;border-radius:9px;text-align:left;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--gold);color:#000}
.menu button.danger{color:#ff5a5a}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#121D33;border:1px solid var(--gold);color:#fff;padding:12px 20px;border-radius:25px;display:flex;align-items:center;gap:10px;z-index:9999;opacity:0;transition:all.35s ease;box-shadow:0 8px 25px rgba(0,0,0,.7);font-size:13px;font-weight:600}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast i{color:var(--green)}
</style>
</head><body>

<div class="top">
  <div style="display:flex;align-items:center;gap:10px"><i class="fa fa-arrow-left" style="color:var(--gold)" onclick="location.href='help.html'"></i><div style="width:40px;height:40px;border-radius:12px;padding:2px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:grid;place-items:center"><div style="width:100%;height:100%;background:#0b1728;border-radius:10px;display:grid;place-items:center;overflow:hidden"><img src="masonic-icon.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2091/2091665.png'" style="width:26px;height:26px"></div></div><div style="color:var(--gold);font-weight:800;font-size:12px">GLOBAL ADMIN<br><small id="sub" style="color:#00ff88;font-size:9px">Real-time - fetching registration</small></div></div>
  <div id="notifIcon" style="position:relative;display:none"><i class="fa fa-bell" style="color:var(--green);font-size:20px"></i><span id="notifCount" style="position:absolute;top:-8px;right:-8px;background:var(--green);color:#000;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:50%;display:grid;place-items:center"></span></div>
</div>

<div id="membersList"></div>

<div id="chatPage">
  <div style="background:var(--card);padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)"><i class="fa fa-arrow-left" style="color:var(--gold);font-size:18px;cursor:pointer" onclick="closeChat()"></i><img src="masonic-icon.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2091/2091665.png'" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--gold)"><div style="flex:1"><h4 id="chatName" style="color:var(--gold);font-size:13px"></h4><small id="chatSub" style="color:#aaa;font-size:9px">Swipe right to reply</small></div></div>
  <div id="messages"></div>
  <div class="reply-bar" id="replyBar"><div><small id="replyToName" style="color:var(--gold);font-weight:800"></small><div id="replyToText" style="color:#aaa;font-size:11px"></div></div><i class="fa fa-times" style="color:#fff;cursor:pointer" onclick="cancelReply()"></i></div>
  <div class="input-area"><input id="msgInput" placeholder="Type message..."><button class="icon-btn" onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button></div>
</div>

<div id="msgMenu" class="menu">
  <button onclick="replyMsg()"><i class="fa fa-reply"></i> Reply</button>
  <button onclick="copyMsg()"><i class="fa fa-copy"></i> Copy</button>
  <button id="editBtn" onclick="editMsg()"><i class="fa fa-pen"></i> Edit</button>
  <button onclick="deleteForMe()" class="danger"><i class="fa fa-eye-slash"></i> Delete for me</button>
  <button onclick="deleteForEveryone()" class="danger"><i class="fa fa-trash"></i> Delete for everyone</button>
</div>

<div id="chatMenu" class="menu">
  <button onclick="deleteChatForMe()" class="danger"><i class="fa fa-trash"></i> Delete</button>
  <button onclick="hideMenus()"><i class="fa fa-times"></i> Cancel</button>
</div>

<div id="toast"><i class="fa fa-check-circle"></i><span id="toastText">Deleted successfully</span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, update, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",
  authDomain: "mansonry-family-fraternity.firebaseapp.com",
  databaseURL: "https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mansonry-family-fraternity",
  storageBucket: "mansonry-family-fraternity.firebasestorage.app",
  messagingSenderId: "964415179161",
  appId: "1:964415179161:web:c8fd1a777542932d7c6b08",
  measurementId: "G-Q8LC74ZFXN"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const ADMIN_EMAIL = "mansoryfamilyn@gmail.com";
const ADMIN_UID = "DMeM2UuLgDOusNvmzRGZygBdxOG2";

let myId=null, myEmail="", isAdmin=false, currentChatId=null, myInfo=null;
let selId=null, selText=null, selIsMine=false, replyData=null, selChatId=null;

function showToast(msg="Deleted successfully"){
  document.getElementById('toastText').innerText=msg;
  const t=document.getElementById('toast'); t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2500);
}

onAuthStateChanged(auth, (u)=>{
  if(!u) return;
  myId=u.uid; myEmail=(u.email||"").toLowerCase(); isAdmin=(myEmail===ADMIN_EMAIL);
  loadAll();
});

async function loadAll(){
  onValue(ref(db,'/'), (snapRoot)=>{
    const root = snapRoot.val()||{};
    const chatsRaw = root.chats||{};

    const byUid = {};
    const byKey = {};

    function scanCollection(obj){
      if(!obj || typeof obj!=='object') return;
      Object.values(obj).forEach(v=>{
        if(!v || typeof v!=='object') return;
        if(v.fullName || v.name || v.phone || v.email){
          const uid = v.uid || v.userId || v.id;
          if(uid){
            byUid[uid] = {...byUid[uid],...v};
            byUid[uid.toLowerCase?.()||uid] = byUid[uid];
          }
        }
      });
    }

    scanCollection(root);
    if(root.users) scanCollection(root.users);
    if(root.members) scanCollection(root.members);
    if(root.Members) scanCollection(root.Members);
    if(root.Users) scanCollection(root.Users);
    if(root.accounts) scanCollection(root.accounts);

    Object.keys(root).forEach(k=>{
      const v=root[k];
      if(v && typeof v==='object' && (v.fullName || v.name || v.phone)){
        byKey[k]=v;
        if(v.uid) byUid[v.uid]=v;
        byUid[k]=v;
      }
    });

    myInfo = byUid[myId] || byKey[myId] || root[myId] || (root.users&&root.users[myId]) || (root.members&&root.members[myId]) || myInfo || {fullName:'Member'};

    const list=document.getElementById('membersList');
    list.innerHTML=""; let cards=[]; let totalNew=0;

    Object.keys(chatsRaw).forEach(chatId=>{
      const chat=chatsRaw[chatId];
      if(!chat) return;
      if(chat.hiddenFor && chat.hiddenFor[myId]) return;
      if(!chatId.includes(ADMIN_UID)) return;
      let otherUid=chatId.replace(ADMIN_UID+'_','');
      if(!otherUid || otherUid===ADMIN_UID) return;
      if(!isAdmin && otherUid!==myId) return;

      const msgs=chat.messages||{};
      // ✅ COUNT RECEIVED + SENT
      const allVisible = Object.keys(msgs).filter(mid=>!(msgs[mid].deletedFor && msgs[mid].deletedFor[myId]));
      const count = allVisible.length;

      if(isAdmin && count===0 &&!chat.lastMessage) return;

      const info=chat.info||{};
      const reg = byUid[otherUid] || byKey[otherUid] || {};
      const name = reg.fullName || reg.name || reg.username || info.fullName || info.name || 'Member';
      const phone = reg.phone || reg.phoneNumber || reg.mobile || reg.tel || info.phone || 'No phone';
      const country = reg.country || reg.Country || reg.location || info.country || 'No country';

      let lastMsg=null;
      Object.keys(msgs).sort((a,b)=>(msgs[b].time||0)-(msgs[a].time||0)).forEach(mid=>{
        const m=msgs[mid];
        if(m.deletedFor && m.deletedFor[myId]) return;
        if(!lastMsg) lastMsg=m;
      });
      if(!lastMsg) lastMsg={text:chat.lastMessage||'', time:chat.lastTime||0, senderId:''};

      const lastTime=lastMsg.time||chat.lastTime||0;
      const isReceived=lastMsg.senderId!==myId && lastMsg.senderId!=='';
      const isUnread=isReceived && (!chat.seenByAdmin || (isAdmin && lastTime > (chat.seenByAdmin||0)));
      if(isAdmin && isUnread) totalNew++;

      cards.push({chatId, otherUid, name, phone, country, lastText:lastMsg.text||'', lastTime, count, isUnread, isReceived, initials:name.slice(0,2).toUpperCase()});
    });

    cards.sort((a,b)=> b.lastTime - a.lastTime);

    if(isAdmin){
      if(cards.length===0){
        list.innerHTML='<div style="text-align:center;padding:50px;color:#666"><i class="fa fa-comments" style="font-size:50px"></i><br>No messages yet</div>';
      } else {
        cards.forEach(c=>{
          const green=c.isUnread && c.isReceived;
          list.innerHTML+=`
            <div class="member-item ${green?'new-msg':''}" data-chatid="${c.chatId}" data-other="${c.otherUid}">
              <div style="width:46px;height:46px;border-radius:50%;background:#121D33;border:2px solid ${green?'#00ff88':'#D4B16A'};display:grid;place-items:center;color:${green?'#00ff88':'#D4B16A'};font-weight:800">${c.initials}</div>
              <div style="flex:1;overflow:hidden">
                <b style="color:${green?'#00ff88':'#D4B16A'}">${c.name}</b><br>
                <small style="color:#D4B16A"><i class="fa fa-phone"></i> ${c.phone} • <i class="fa fa-globe"></i> ${c.country}</small><br>
                <small style="color:${green?'#fff':'#aaa'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${c.lastText} • ${c.count} msgs (received + sent)</small>
              </div>
              ${green? `<div class="badge" style="position:static">${c.count}</div>` : `<i class="fa fa-chevron-right" style="color:#D4B16A"></i>`}
            </div>`;
        });
      }
      document.getElementById('notifIcon').style.display=totalNew>0?'block':'none';
      document.getElementById('notifCount').innerText=totalNew;
    } else {
      if(cards.length>0){
        const c=cards[0];
        list.innerHTML=`
          <div class="member-item" data-chatid="${c.chatId}" data-other="${ADMIN_UID}" style="border:2px solid var(--gold)">
            <div style="width:48px;height:48px;border-radius:50%;background:#0b1728;border:2px solid var(--gold);display:grid;place-items:center;overflow:hidden"><img src="masonic-icon.png" style="width:28px;height:28px"></div>
            <div style="flex:1"><b style="color:var(--gold)">ADMINISTRATION CHANNEL</b><br><small style="color:#00ff88">● Official • ${c.count} msgs (received + sent)</small><br><small style="color:#aaa">${c.lastText}</small></div>
            <i class="fa fa-shield-alt" style="color:var(--gold)"></i>
          </div>`;
      } else {
        list.innerHTML=`
          <div class="member-item" data-chatid="${ADMIN_UID+'_'+myId}" data-other="${ADMIN_UID}" style="border:2px solid var(--gold)">
            <div style="width:48px;height:48px;border-radius:50%;background:#0b1728;border:2px solid var(--gold);display:grid;place-items:center;overflow:hidden"><img src="masonic-icon.png" style="width:30px;height:30px"></div>
            <div style="flex:1"><b style="color:var(--gold)">ADMINISTRATION CHANNEL</b><br><small style="color:#00ff88">● Official</small><br><small style="color:#aaa">Tap to message</small></div>
            <i class="fa fa-lock" style="color:var(--gold)"></i>
          </div>`;
      }
    }

    setTimeout(()=>{
      document.querySelectorAll('.member-item').forEach(el=>{
        let timer;
        const showChatM=(e)=>{
          e.preventDefault();
          selChatId=el.dataset.chatid;
          const menu=document.getElementById('chatMenu');
          menu.style.left=(e.touches?e.touches[0].clientX:e.clientX)-120+'px';
          menu.style.top=(e.touches?e.touches[0].clientY:e.clientY)+'px';
          menu.style.display='flex';
        };
        el.addEventListener('contextmenu', showChatM);
        el.addEventListener('touchstart', e=>{ timer=setTimeout(()=>showChatM(e),700); });
        el.addEventListener('touchend', ()=>clearTimeout(timer));
        el.addEventListener('click', ()=> openChat(el.dataset.other, el.querySelector('b').innerText));
      });
    },100);
  });
}

window.openChat=async (otherUid, displayName)=>{
  currentChatId = isAdmin? (ADMIN_UID+"_"+otherUid) : (ADMIN_UID+"_"+myId);
  document.getElementById('chatName').innerText=displayName;
  document.getElementById('chatPage').style.display='flex';
  if(isAdmin){ await update(ref(db,`chats/${currentChatId}`),{seenByAdmin:Date.now()}); }

  onValue(ref(db,`chats/${currentChatId}/messages`), (snap)=>{
    const box=document.getElementById('messages'); box.innerHTML="";
    const data=snap.val()||{};
    Object.keys(data).sort((a,b)=>(data[a].time||0)-(data[b].time||0)).forEach(mid=>{
      const m=data[mid];
      if(m.deletedFor && m.deletedFor[myId]) return;
      const isMe=m.senderId===myId;

      const wrap=document.createElement('div');
      wrap.className='msg-wrap';
      wrap.style.justifyContent=isMe?'flex-end':'flex-start';

      const icon=document.createElement('div');
      icon.className='reply-icon';
      icon.innerHTML='<i class="fa fa-reply"></i>';

      const div=document.createElement('div');
      div.className='msg '+(isMe?'my-msg':'other-msg');
      let html='';
      if(m.replyTo){ html+=`<div class="reply-preview"><b style="color:var(--gold)">${m.replyTo.name}</b><br>${m.replyTo.text}</div>`; }
      html+=`${m.text}<span style="font-size:8px;opacity:.6;float:right;margin-left:6px;margin-top:4px">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;
      div.innerHTML=html;

      wrap.appendChild(icon);
      wrap.appendChild(div);
      box.appendChild(wrap);

      div.addEventListener('contextmenu', e=>{ e.preventDefault(); showMsgMenu(e,mid,m.text,isMe); });

      let startX=0, curX=0, swiping=false, longT=null;
      div.addEventListener('touchstart', e=>{
        startX=e.touches[0].clientX; swiping=true; div.classList.add('swiping');
        longT=setTimeout(()=>{ showMsgMenu(e,mid,m.text,isMe); swiping=false; },600);
      },{passive:true});
      div.addEventListener('touchmove', e=>{
        if(!swiping) return;
        const diff=e.touches[0].clientX-startX;
        if(diff>15) clearTimeout(longT);
        if(diff>0 && diff<110){
          curX=diff;
          div.style.transform=`translateX(${curX}px)`;
          icon.style.opacity=Math.min(curX/60,1);
          icon.style.transform=`translateY(-50%) scale(${0.6+Math.min(curX/60,1)*0.4})`;
        }
      },{passive:true});
      div.addEventListener('touchend', ()=>{
        clearTimeout(longT);
        if(!swiping) return;
        swiping=false; div.classList.remove('swiping');
        if(curX>55){ setReply(m.text, isMe?'You':document.getElementById('chatName').innerText); if(navigator.vibrate) navigator.vibrate(25); }
        div.style.transform='translateX(0)'; icon.style.opacity='0'; curX=0;
      });
    });
    box.scrollTop=box.scrollHeight;
  });
}

function showMsgMenu(e, mid, text, isMine){
  selId=mid; selText=text; selIsMine=isMine;
  const menu=document.getElementById('msgMenu');
  menu.style.left=(e.touches?e.touches[0].clientX:e.clientX)-100+'px';
  menu.style.top=(e.touches?e.touches[0].clientY:e.clientY)+'px';
  menu.style.display='flex';
  document.getElementById('editBtn').style.display=isMine?'flex':'none';
}
window.copyMsg=()=>{ navigator.clipboard.writeText(selText); hideMenus(); showToast('Copied'); }
window.editMsg=async()=>{ const nt=prompt('Edit:',selText); if(nt){ await update(ref(db,`chats/${currentChatId}/messages/${selId}`),{text:nt}); showToast('Edited successfully'); } hideMenus(); }
window.replyMsg=()=>{ setReply(selText, selIsMine?'You':document.getElementById('chatName').innerText); hideMenus(); }
function setReply(text, name){
  replyData={text, name};
  document.getElementById('replyBar').style.display='flex';
  document.getElementById('replyToName').innerText=name;
  document.getElementById('replyToText').innerText=text.slice(0,50);
  document.getElementById('msgInput').focus();
}
window.cancelReply=()=>{ replyData=null; document.getElementById('replyBar').style.display='none'; }
window.deleteForMe=async()=>{
  await update(ref(db,`chats/${currentChatId}/messages/${selId}/deletedFor`),{[myId]:true});
  hideMenus(); showToast('Deleted successfully');
}
window.deleteForEveryone=async()=>{
  if(confirm('Delete for everyone?')){
    await remove(ref(db,`chats/${currentChatId}/messages/${selId}`));
    showToast('Deleted successfully');
  }
  hideMenus();
}
window.deleteChatForMe=async()=>{
