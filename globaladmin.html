<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL ADMIN PANEL</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#080E1F;--card:#121D33;--border:#1E2E4F;--gold:#D4B16A;--gold2:#F0D185}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column}
.top{padding:12px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#membersList{flex:1;overflow-y:auto;padding:8px}
.member-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin:8px 0;cursor:pointer}
#chatPage{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;background:#080E1F}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;margin:5px 0;font-size:13px;cursor:pointer}
.my-msg{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000;margin-left:auto;align-self:flex-end}
.other-msg{background:var(--card);border:1px solid var(--border);margin-right:auto;align-self:flex-start}
.input-area{background:var(--card);border-top:1px solid var(--border);padding:8px;display:flex;gap:8px}
.input-area input{flex:1;background:#0A1428;border:1px solid var(--border);color:#fff;padding:11px;border-radius:20px;outline:none}
.icon-btn{background:var(--gold);color:#000;width:42px;height:42px;border-radius:50%;border:none;display:grid;place-items:center}
#ctxMenu{position:fixed;z-index:100;background:#1a2a4a;border:1px solid var(--gold);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:160px}
#ctxMenu button{background:var(--card);border:1px solid var(--border);color:#fff;padding:10px;border-radius:9px;text-align:left;display:flex;gap:8px;align-items:center}
#ctxMenu button:hover{background:var(--gold);color:#000}
</style>
</head><body>

<div class="top">
  <div style="display:flex;align-items:center;gap:10px"><i class="fa fa-arrow-left" style="color:var(--gold)" onclick="location.href='help.html'"></i><div style="color:var(--gold);font-weight:800;font-size:12px">GLOBAL ADMIN<br><small id="sub" style="color:#00ff88;font-size:9px">Loading...</small></div></div>
  <div id="roleBtn" style="font-size:8px;background:var(--gold);color:#000;padding:6px 10px;border-radius:15px;font-weight:800"></div>
</div>

<div id="membersList"><div style="text-align:center;padding:30px;color:#aaa">Syncing ROOT + /members + /chats...</div></div>

<div id="chatPage">
  <div style="background:var(--card);padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)"><i class="fa fa-arrow-left" style="color:var(--gold)" onclick="closeChat()"></i><h4 id="chatName" style="color:var(--gold)"></h4><small id="chatIdShow" style="margin-left:auto;font-size:7px;color:#aaa"></small></div>
  <div id="messages"></div>
  <div class="input-area"><input id="msgInput" placeholder="Type message..."><button class="icon-btn" onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button></div>
</div>

<div id="ctxMenu">
  <button onclick="copyMsg()"><i class="fa fa-copy"></i> Copy</button>
  <button id="editBtn" onclick="editMsg()"><i class="fa fa-pen"></i> Edit</button>
  <button onclick="deleteMsg()" style="color:#ff5a5a"><i class="fa fa-trash"></i> Delete</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, update, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",
  authDomain: "mansonry-family-fraternity.firebaseapp.com",
  databaseURL: "https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mansonry-family-fraternity",
  storageBucket: "mansonry-family-fraternity.firebasestorage.app",
  messagingSenderId: "964415179161",
  appId: "1:964415179161:web:c8fd1a777542932d7c6b08",
  measurementId: "G-Q8LC74ZFXN"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const ADMIN_EMAIL = "mansoryfamilyn@gmail.com";
const ADMIN_UID = "DMeM2UuLgDOusNvmzRGZygBdxOG2";

let myId=null, myEmail="", isAdmin=false, currentChatId=null, currentOtherUid=null;
let selId=null, selText=null;

onAuthStateChanged(auth, (user)=>{
  if(!user){ document.getElementById('membersList').innerHTML='<div style="text-align:center;padding:40px"><a href="login.html" style="color:var(--gold)">Login first</a></div>'; return; }
  myId=user.uid; myEmail=(user.email||"").toLowerCase(); isAdmin=(myEmail===ADMIN_EMAIL);
  document.getElementById('roleBtn').innerText=isAdmin?'ADMIN':'MEMBER';
  document.getElementById('sub').innerText=isAdmin?'ADMIN: '+myEmail:'MEMBER: '+myEmail;
  loadAll();
});

async function loadAll(){
  // Get users from 3 places
  const list=document.getElementById('membersList');

  onValue(ref(db,'/'), async (snapRoot)=>{
    const rawRoot=snapRoot.val()||{};
    // Also check /members node if exists
    const snapMembers = await get(ref(db,'members'));
    const rawMembers = snapMembers.val()||{};
    const snapUsers = await get(ref(db,'users'));
    const rawUsers = snapUsers.val()||{};

    // Merge all users
    let all = [];
    [rawRoot, rawMembers, rawUsers].forEach(raw=>{
      Object.keys(raw).forEach(k=>{
        const v=raw[k];
        if(typeof v==='object' && v!==null && v.email){
          all.push({dbKey:k, uid:v.uid||k,...v});
        }
      });
    });
    // Deduplicate by uid/email
    const seen=new Set(); const users=[];
    all.forEach(u=>{ const key=(u.uid||u.email).toLowerCase(); if(!seen.has(key)){ seen.add(key); users.push(u); } });

    // Also get chats for admin
    let chatList=[];
    if(isAdmin){
      const snapChats = await get(ref(db,'chats'));
      const chatsRaw = snapChats.val()||{};
      Object.keys(chatsRaw).forEach(chatId=>{
        if(chatId.includes(ADMIN_UID)){
          const msgs = chatsRaw[chatId].messages||{};
          const lastKey = Object.keys(msgs).pop();
          const lastMsg = lastKey? msgs[lastKey] : null;
          const otherUid = chatId.replace(ADMIN_UID+'_','').replace('_'+ADMIN_UID,'');
          chatList.push({chatId, otherUid, lastMsg, count:Object.keys(msgs).length});
        }
      });
    }

    list.innerHTML="";

    if(isAdmin){
      // Show users
      users.forEach(u=>{
        if((u.uid||u.dbKey)===myId || u.email.toLowerCase()===ADMIN_EMAIL) return;
        const name=u.fullName||u.name||'Member';
        list.innerHTML+=`<div class="member-item" onclick="openChat('${u.uid||u.dbKey}','${name.replace(/'/g,'')}')">
          <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=121D33&color=D4B16A" style="width:42px;height:42px;border-radius:50%;border:2px solid var(--gold)">
          <div style="flex:1"><b style="color:var(--gold)">${name}</b><br><small style="color:#aaa">${u.email} • ${u.phone||''}</small></div>
        </div>`;
      });
      // Show chats even if user not in users list - THIS FIXES YOUR ISSUE
      chatList.forEach(c=>{
        const alreadyShown = users.find(u=> (u.uid||u.dbKey)===c.otherUid);
        if(alreadyShown) return;
        const lastText = c.lastMsg? c.lastMsg.text.slice(0,30) : 'New message';
        list.innerHTML+=`<div class="member-item" style="border-color:#00ff88" onclick="openChat('${c.otherUid}','Member ${c.otherUid.slice(0,6)}')">
          <img src="https://ui-avatars.com/api/?name=Member&background=121D33&color=00ff88" style="width:42px;height:42px;border-radius:50%;border:2px solid #00ff88">
          <div style="flex:1"><b style="color:#00ff88">Chat from member • ${c.count} msgs</b><br><small style="color:#fff">${lastText}...</small><br><small style="color:#aaa">UID: ${c.otherUid.slice(0,10)}... • Tap to open</small></div>
          <i class="fa fa-envelope" style="color:#00ff88"></i>
        </div>`;
      });

      if(list.innerHTML==="") list.innerHTML='<div style="text-align:center;padding:20px;color:#aaa">No members and no chats yet<br><small>When member sends message, it will appear here</small></div>';
    } else {
      // Member sees admin
      let adminUsers = users.filter(u=> u.email.toLowerCase()===ADMIN_EMAIL || u.role==='admin');
      if(adminUsers.length===0) adminUsers=[{dbKey:ADMIN_UID, uid:ADMIN_UID, fullName:'Mansory Family Director', email:ADMIN_EMAIL}];
      adminUsers.forEach(u=>{
        const name=u.fullName||'Administration';
        list.innerHTML+=`<div class="member-item" style="border-color:var(--gold)" onclick="openChat('${u.uid||u.dbKey}','${name}')">
          <img src="https://cdn-icons-png.flaticon.com/512/2091/2091665.png" style="width:42px;height:42px;border-radius:50%">
          <div style="flex:1"><b style="color:var(--gold)">${name} <span style="background:var(--gold);color:#000;font-size:8px;padding:2px 5px;border-radius:8px">ADMIN</span></b><br><small style="color:#00ff88">${u.email} • Tap to chat</small></div>
        </div>`;
      });
    }
  });
}

window.openChat=(otherUid, name)=>{
  currentOtherUid=otherUid;
  if(isAdmin){ currentChatId = ADMIN_UID + "_" + otherUid; } else { currentChatId = ADMIN_UID + "_" + myId; }
  document.getElementById('chatName').innerText=name;
  document.getElementById('chatIdShow').innerText=currentChatId;
  document.getElementById('chatPage').style.display='flex';
  onValue(ref(db,`chats/${currentChatId}/messages`), (snap)=>{
    const box=document.getElementById('messages'); box.innerHTML="";
    const data=snap.val()||{};
    Object.keys(data).forEach(mid=>{
      const m=data[mid]; const isMe=m.senderId===myId;
      const div=document.createElement('div');
      div.className='msg '+(isMe?'my-msg':'other-msg');
      div.innerHTML=`${m.text}<span style="font-size:8px;opacity:.6;float:right;margin-left:6px;margin-top:4px">${new Date(m.time).toLocaleTimeString()}</span>`;
      div.addEventListener('contextmenu', e=>{ e.preventDefault(); showMenu(e,mid,m.text,isMe); });
      let t; div.addEventListener('touchstart', e=>{ t=setTimeout(()=>showMenu(e,mid,m.text,isMe),600); }); div.addEventListener('touchend',()=>clearTimeout(t));
      box.appendChild(div);
    });
    box.scrollTop=box.scrollHeight;
  });
}

function showMenu(e, mid, text, isMine){
  selId=mid; selText=text;
  const menu=document.getElementById('ctxMenu');
  const x=e.touches?e.touches[0].clientX:e.clientX; const y=e.touches?e.touches[0].clientY:e.clientY;
  menu.style.left=(x-80)+'px'; menu.style.top=y+'px'; menu.style.display='flex';
  document.getElementById('editBtn').style.display=isMine?'flex':'none';
}
window.copyMsg=()=>{ navigator.clipboard.writeText(selText); hideMenu(); }
window.deleteMsg=async()=>{ if(confirm('Delete?')) await remove(ref(db,`chats/${currentChatId}/messages/${selId}`)); hideMenu(); }
window.editMsg=async()=>{ const nt=prompt('Edit:',selText); if(nt) await update(ref(db,`chats/${currentChatId}/messages/${selId}`),{text:nt}); hideMenu(); }
function hideMenu(){ document.getElementById('ctxMenu').style.display='none'; }
document.addEventListener('click', e=>{ if(!e.target.closest('#ctxMenu')) hideMenu(); });
window.sendMsg=async()=>{
  const i=document.getElementById('msgInput'); const txt=i.value.trim(); if(!txt||!currentChatId) return;
  const r=push(ref(db,`chats/${currentChatId}/messages`));
  await set(r,{text:txt, senderId:myId, senderEmail:myEmail, time:Date.now()});
  i.value="";
}
window.closeChat=()=>document.getElementById('chatPage').style.display='none';
</script>
</body></html>
