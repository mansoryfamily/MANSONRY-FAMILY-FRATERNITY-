<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL ADMIN PANEL</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#080E1F;--card:#121D33;--border:#1E2E4F;--gold:#D4B16A;--gold2:#F0D185;--green:#00ff88;--blue:#53bdeb}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:12px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#membersList{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column}
.member-item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin:6px 0;cursor:pointer}
.member-item.new-msg{border:2px solid var(--green)}
.badge{background:var(--green);color:#000;font-size:11px;font-weight:900;min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
#chatPage{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;background:#080E1F;gap:3px}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;margin:4px 0;font-size:13px;position:relative}
.my-msg{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000;margin-left:auto}
.other-msg{background:var(--card);border:1px solid var(--border);margin-right:auto}
.input-area{background:var(--card);border-top:1px solid var(--border);padding:8px;display:flex;gap:8px;align-items:center}
.input-area input{flex:1;background:#0A1428;border:1px solid var(--border);color:#fff;padding:11px;border-radius:20px;outline:none}
.icon-btn{background:var(--gold);color:#000;width:42px;height:42px;border-radius:50%;border:none;display:grid;place-items:center}
.media-box{border-radius:12px;overflow:hidden;margin-bottom:6px;background:#000}
.media-box img{width:100%;max-width:260px;display:block;border-radius:12px}
.tick{font-size:11px;margin-left:4px;font-weight:900}
.tick-sent{color:#555}.tick-delivered{color:#888}.tick-read{color:var(--blue)}
.msg-footer{display:flex;justify-content:flex-end;align-items:center;margin-top:4px;gap:2px}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#121D33;border:1px solid var(--gold);color:#fff;padding:12px 20px;border-radius:25px;display:flex;gap:10px;z-index:9999;opacity:0;transition:all.35s}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head><body>
<div class="top">
<div style="display:flex;align-items:center;gap:10px"><i class="fa fa-arrow-left" style="color:var(--gold)" onclick="location.href='help.html'"></i><div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:grid;place-items:center"><div style="width:100%;height:100%;background:#0b1728;border-radius:10px;display:grid;place-items:center"><img src="masonic-icon.png" style="width:26px;height:26px"></div></div><div style="color:var(--gold);font-weight:800;font-size:12px">GLOBAL ADMIN<br><small id="sub" style="color:#00ff88;font-size:9px">Loading...</small></div></div>
</div>
<div id="membersList" style="padding:10px;color:#888;text-align:center">Loading chats...</div>
<div id="chatPage">
<div style="background:var(--card);padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)"><i class="fa fa-arrow-left" style="color:var(--gold);font-size:18px;cursor:pointer" onclick="closeChat()"></i><img src="masonic-icon.png" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--gold)"><div style="flex:1"><h4 id="chatName" style="color:var(--gold);font-size:13px"></h4></div></div>
<div id="messages"></div>
<div class="input-area">
<input type="file" id="mediaInput" accept="image/*" style="display:none">
<button class="icon-btn" style="background:var(--card);border:1px solid var(--border);color:var(--gold)" onclick="document.getElementById('mediaInput').click()"><i class="fa fa-paperclip"></i></button>
<input id="msgInput" placeholder="Type message...">
<button class="icon-btn" onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button>
</div>
</div>
<div id="toast"><i class="fa fa-check-circle" style="color:#00ff88"></i><span id="toastText"></span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, update, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",
authDomain: "mansonry-family-fraternity.firebaseapp.com",
databaseURL: "https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "mansonry-family-fraternity",
storageBucket: "mansonry-family-fraternity.firebasestorage.app",
messagingSenderId: "964415179161",
appId: "1:964415179161:web:c8fd1a777542932d7c6b08"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const ADMIN_UID = "DMeM2UuLgDOusNvmzRGZygBdxOG2";
const ADMIN_EMAIL = "mansoryfamilyn@gmail.com";
let myId=null, myEmail="", isAdmin=false, currentChatId=null, myInfo={fullName:'Member'};

function toast(m){ document.getElementById('toastText').innerText=m; const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

onAuthStateChanged(auth, async u=>{
 if(!u) return;
 myId=u.uid; myEmail=(u.email||"").toLowerCase(); isAdmin=myEmail===ADMIN_EMAIL;
 document.getElementById('sub').innerText=isAdmin?'ADMIN':'ADMINISTRATION CHANNEL';
 try{ const s=await get(ref(db,'users')); if(s.exists()){ const v=Object.values(s.val()).find(x=>x.uid===myId); if(v) myInfo=v; } }catch(e){}
 loadChats();
});

function loadChats(){
 onValue(ref(db,'chats'), snap=>{
  const chats=snap.val()||{};
  const list=document.getElementById('membersList');
  let cards=[];
  Object.keys(chats).forEach(chatId=>{
   if(!chatId.includes(ADMIN_UID)) return;
   const chat=chats[chatId];
   if(chat.hiddenFor&&chat.hiddenFor[myId]) return;
   let other=chatId.replace(ADMIN_UID+'_','');
   if(!other||other===ADMIN_UID) return;
   if(!isAdmin&&other!==myId) return;
   const msgs=chat.messages||{};
   let last=null; Object.keys(msgs).sort((a,b)=>(msgs[b].time||0)-(msgs[a].time||0)).forEach(k=>{ if(!last) last=msgs[k]; });
   const preview= last?.mediaUrl?'📷 Photo' : (last?.text||'Tap to message');
   const name=chat.info?.fullName||'Member';
   cards.push({chatId,other,name,lastTime:last?.time||chat.lastTime||0,preview});
  });
  cards.sort((a,b)=>b.lastTime-a.lastTime);
  if(cards.length===0){
   list.innerHTML=`<div class="member-item" data-chatid="${ADMIN_UID+'_'+myId}" data-other="${ADMIN_UID}"><b style="color:var(--gold)">ADMINISTRATION CHANNEL</b></div>`;
  } else {
   let h=''; cards.forEach(c=>{
    h+=`<div class="member-item" data-chatid="${c.chatId}" data-other="${c.other}"><div style="width:40px;height:40px;border-radius:50%;background:#121D33;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-weight:800">${c.name.slice(0,2)}</div><div style="flex:1;text-align:left"><b style="color:var(--gold)">${c.name}</b><br><small style="color:#aaa">${c.preview}</small></div></div>`;
   }); list.innerHTML=h;
  }
  document.querySelectorAll('.member-item').forEach(el=>{ el.onclick=()=>openChat(el.dataset.other, el.querySelector('b').innerText); });
 });
}

window.openChat=async(otherUid, displayName)=>{
 currentChatId=isAdmin?ADMIN_UID+"_"+otherUid:ADMIN_UID+"_"+myId;
 document.getElementById('chatName').innerText=displayName;
 document.getElementById('chatPage').style.display='flex';
 try{
  if(isAdmin) await update(ref(db,`chats/${currentChatId}`),{seenByAdmin:Date.now()});
  else await update(ref(db,`chats/${currentChatId}`),{seenByMember:Date.now()});
  const s=await get(ref(db,`chats/${currentChatId}/messages`));
  if(s.exists()){ for(let k in s.val()){ if(s.val()[k].senderId!==myId) await update(ref(db,`chats/${currentChatId}/messages/${k}`),{status:'read'}).catch(()=>{}); } }
 }catch(e){}
 onValue(ref(db,`chats/${currentChatId}/messages`), snap=>{
  const box=document.getElementById('messages'); box.innerHTML="";
  const data=snap.val()||{};
  Object.keys(data).sort((a,b)=>(data[a].time||0)-(data[b].time||0)).forEach(mid=>{
   const m=data[mid];
   if(m.deletedFor&&m.deletedFor[myId]) return;
   const isMe=m.senderId===myId;
   if(!isMe&&m.status==='sent'){ update(ref(db,`chats/${currentChatId}/messages/${mid}`),{status:'delivered'}).catch(()=>{}); }
   const d=document.createElement('div'); d.className='msg '+(isMe?'my-msg':'other-msg');
   let html='';
   if(m.mediaUrl) html+=`<div class="media-box"><img src="${m.mediaUrl}"></div>`;
   if(m.text) html+=`<div>${m.text}</div>`;
   let tick=''; if(isMe){ if(m.status==='read') tick='<span class="tick tick-read">✓✓</span>'; else if(m.status==='delivered') tick='<span class="tick tick-delivered">✓✓</span>'; else tick='<span class="tick tick-sent">✓</span>'; }
   html+=`<div class="msg-footer"><span style="font-size:8px;opacity:.6">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>${tick}</div>`;
   d.innerHTML=html; box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
 });
}

function getTick(s){ if(s==='read') return '✓✓ blue'; if(s==='delivered') return '✓✓ grey'; return '✓'; }

// FORCE - NO DELETE, NO SENDING TEXT, DIRECT SAVE
document.getElementById('mediaInput').addEventListener('change', async e=>{
 const file=e.target.files[0]; if(!file||!currentChatId) return;
 toast('Sending photo...');
 try{
  const base64=await new Promise((res,rej)=>{
   const reader=new FileReader();
   reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
     const canvas=document.createElement('canvas');
     let w=img.width, h=img.height;
     const MAX=600;
     if(w>MAX||h>MAX){ if(w>h){ h=h*(MAX/w); w=MAX; } else { w=w*(MAX/h); h=MAX; } }
     canvas.width=w; canvas.height=h;
     canvas.getContext('2d').drawImage(img,0,0,w,h);
     res(canvas.toDataURL('image/jpeg',0.45));
    };
    img.onerror=rej; img.src=ev.target.result;
   };
   reader.onerror=rej; reader.readAsDataURL(file);
  });
  const payload={ senderId:myId, time:Date.now(), mediaUrl:base64, mediaType:'image', text:'', status:'sent' };
  const r=push(ref(db,`chats/${currentChatId}/messages`));
  await set(r,payload);
  await update(ref(db,`chats/${currentChatId}`),{lastTime:Date.now(),lastMessage:'📷 Photo',info:{fullName:myInfo.fullName||'Member',uid:myId}}).catch(()=>{});
  toast('Sent ✓');
 }catch(err){ toast('Failed: '+err.message); console.error(err); }
 e.target.value='';
});

window.sendMsg=async()=>{
 const i=document.getElementById('msgInput'); const txt=i.value.trim(); if(!txt||!currentChatId) return;
 const r=push(ref(db,`chats/${currentChatId}/messages`));
 await set(r,{text:txt,senderId:myId,time:Date.now(),status:'sent'});
 await update(ref(db,`chats/${currentChatId}`),{lastTime:Date.now(),lastMessage:txt}).catch(()=>{});
 i.value='';
}
window.closeChat=()=>{ document.getElementById('chatPage').style.display='none'; currentChatId=null; }
</script>
</body></html>
