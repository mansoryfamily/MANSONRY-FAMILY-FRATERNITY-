<style>
:root{--bg:#080E1F;--card:#121D33;--border:#1E2E4F;--gold:#D4B16A;--gold2:#F0D185;--green:#00ff88}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:12px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#membersList{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column}
.member-item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin:6px 0;cursor:pointer}
.member-item.new-msg{border:2px solid var(--green);background:linear-gradient(145deg,#0f2a1f,#121D33)}
.badge{background:var(--green);color:#000;font-size:11px;font-weight:900;min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
#chatPage{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;background:#080E1F;gap:3px}
.msg-wrap{position:relative;width:100%;display:flex;align-items:center}
.reply-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%) scale(0.6);width:32px;height:32px;background:var(--gold);border-radius:50%;display:grid;place-items:center;color:#000;opacity:0;transition:all.2s ease;z-index:1}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;margin:4px 0;font-size:13px;cursor:pointer;transition:transform.22s ease;position:relative;z-index:2;touch-action:pan-y;user-select:none}
.msg-sender{font-size:10px;font-weight:800;color:var(--gold);margin-bottom:5px;letter-spacing:.3px;opacity:.95}
.msg.swiping{transition:none}
.my-msg{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000;margin-left:auto}
.other-msg{background:var(--card);border:1px solid var(--border);margin-right:auto}.reply-preview{border-left:3px solid var(--gold);background:rgba(212,177,106,.15);padding:6px 8px;border-radius:6px;margin-bottom:6px;font-size:11px}
.reply-bar{background:#0A1428;border-left:3px solid var(--gold);padding:8px 10px;display:none;justify-content:space-between;align-items:center}
.input-area{background:var(--card);border-top:1px solid var(--border);padding:8px;display:flex;gap:8px;align-items:center}
.input-area input{flex:1;background:#0A1428;border:1px solid var(--border);color:#fff;padding:11px;border-radius:20px;outline:none}
.icon-btn{background:var(--gold);color:#000;width:42px;height:42px;border-radius:50%;border:none;display:grid;place-items:center}
.menu{position:fixed;z-index:100;background:#1a2a4a;border:1px solid var(--gold);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:200px}
.menu button{background:var(--card);border:1px solid var(--border);color:#fff;padding:11px;border-radius:9px;text-align:left;display:flex;gap:10px;align-items:center;cursor:pointer}
.menu button.danger{color:#ff5a5a}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#121D33;border:1px solid var(--gold);color:#fff;padding:12px 20px;border-radius:25px;display:flex;align-items:center;gap:10px;z-index:9999;opacity:0;transition:all.35s ease}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.media-box{border-radius:12px;overflow:hidden;margin-bottom:6px;position:relative;background:#000}
.media-box img,.media-box video{width:100%;max-width:260px;max-height:320px;border-radius:12px;display:block;object-fit:cover}
.media-down{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.85);border:1px solid var(--gold);color:var(--gold);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:5}
.tick{font-size:11px;margin-left:4px;font-weight:900}
.tick-sent{color:#555}.tick-delivered{color:#888}.tick-read{color:#53bdeb}
.msg-translation{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(212,177,106,.5);font-size:12px;line-height:1.5}
.msg-translation .tr-head{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-weight:600;font-size:11px}
.msg-translation select{background:rgba(0,0,0,.3);color:inherit;border:1px solid rgba(212,177,106,.5);border-radius:8px;padding:2px 4px;font-size:11px;font-family:inherit;max-width:140px}
.msg-translation .tr-source{opacity:.8;font-weight:500}
.msg-translation .tr-close{margin-left:auto;cursor:pointer;opacity:.7;font-size:15px;line-height:1;padding:0 2px}
.msg-translation .tr-close:hover{opacity:1}
.msg-translation .tr-text{font-style:italic;opacity:.95;white-space:pre-wrap}
.my-msg .msg-translation{border-top-color:rgba(0,0,0,.3)}
.my-msg .msg-translation select{background:rgba(255,255,255,.4);color:#111}
.msg-translation .tr-actions{display:flex;gap:6px;margin:6px 0 2px;flex-wrap:wrap}
.msg-translation .tr-actions button{background:rgba(212,177,106,.16);color:inherit;border:1px solid rgba(212,177,106,.55);border-radius:999px;padding:3px 11px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
.msg-translation .tr-actions button.active{background:var(--gold);color:#111;border-color:var(--gold)}
.my-msg .msg-translation .tr-actions button{background:rgba(255,255,255,.35);border-color:rgba(0,0,0,.25);color:#111}
.my-msg .msg-translation .tr-actions button.active{background:#111;color:#f0d185;border-color:#111}
.msg-lang{display:inline-flex;align-items:center;gap:4px;margin:2px 0 5px;padding:2px 8px;border-radius:999px;border:1px solid rgba(212,177,106,.55);background:rgba(212,177,106,.14);color:inherit;font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;opacity:.9}
.msg-lang:hover{opacity:1}
.msg audio{max-width:250px;width:100%;border-radius:10px;display:block;margin-bottom:4px}
</style>

const app=initializeApp(firebaseConfig);const db=getDatabase(app);const auth=getAuth(app);

// Firebase Storage is not provisioned on this Spark project, so chat media is
// stored in the Cloudflare Worker's KV namespace instead. The returned URL is
// public but unguessable, which is enough for lodge media.
async function uploadMediaBlob(blob){
  const user=auth.currentUser;
  if(!user) throw new Error('Not signed in');
  const token=await user.getIdToken();
  const r=await fetch(MEDIA_UPLOAD_URL,{
    method:'POST',
    headers:{'Authorization':'Bearer '+token,'Content-Type':blob.type||'application/octet-stream'},
    body:blob
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok||!data.url) throw new Error(data.error||('Upload failed '+r.status));
  return data.url;
}
const ADMIN_EMAIL="mansoryfamilyn@gmail.com";
const ADMIN_UID="DMeM2UuLgDOusNvmzRGZygBdxOG2";
let myId=null,myEmail="",isAdmin=false,currentChatId=null,myInfo={fullName:'Member'},usersCache={},selId=null,selText=null,selIsMine=false,replyData=null,selChatId=null,selMediaUrl=null;

const PENDING_PREFIX='mff_pending_chat_';
function newMessageId(){
  try{if(crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,12);
}
function pendingKey(chatId,kind){return PENDING_PREFIX+chatId+'_'+kind;}
function readPending(chatId,kind){
  try{const raw=localStorage.getItem(pendingKey(chatId,kind));return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function writePending(chatId,kind,pending){
  try{localStorage.setItem(pendingKey(chatId,kind),JSON.stringify(pending));}catch(e){}
}

  const pending=readPending(chatId,kind);

}
async function publishChatEvent(chatId,pending){

  if(!user)return;
  const text=pending.payload.text||pending.preview||'New message';
  user.getIdToken().then(token=>sendPushUpdate(token,{type:'chat',chatId,messageId:pending.id,text,senderName:'MFF Administration'})).catch(()=>{});
}
async function commitMessage(chatId,kind,pending){
  await set(ref(db,`chats/${chatId}/messages/${pending.id}`),pending.payload);
  // A new message always brings the conversation back for the person who
  // receives it. Only unhiding the sender is what silently lost member
  // messages: if the admin had removed a chat, the member's next message stayed
  // invisible and never raised the unread badge.
  const recipient=isAdmin?chatId.slice(ADMIN_UID.length+1):ADMIN_UID;
  const patch={lastTime:Date.now(),lastMessage:pending.preview,['hiddenFor/'+myId]:null};
  if(recipient&&recipient!==myId) patch['hiddenFor/'+recipient]=null;
  // Never overwrite a good stored name with the generic "Member" fallback.
  // Some older accounts have no users/ record, so chat.info is the admin's
  // only way to know who is writing.
  const realName=String(myInfo.fullName||myInfo.name||'').trim();
  // Only a member writes their own profile here. When the admin replies, keep
  // the member's name instead of replacing it with the admin's name.
  if(!isAdmin&&realName&&realName.toLowerCase()!=='member') patch.info={fullName:realName,uid:myId};
  await update(ref(db,`chats/${chatId}`),patch).catch(()=>{});
  // Do NOT reset seenByAdmin/seenByMember to 0 here. That marked every old
  // message as unread and inflated the badges. The recipient's seen timestamp
  // stays in the past, so only the new message counts as unread.
  await publishChatEvent(chatId,pending);
  publishTelegramMessage(chatId,pending);
  publishPushMessage(chatId,pending);
  clearPending(chatId,kind,pending.id);
}

// Firebase stores "seen" as a timestamp, but a few old chats have `true` in
// that field. Treat true as "everything read" so those chats stop showing
// permanent unread counts.
function seenTime(value){
  if(value===true) return Number.MAX_SAFE_INTEGER;
  const n=Number(value);
  return Number.isFinite(n)?n:0;
}

function emailToName(email){
  const local=String(email||'').split('@')[0].replace(/[._\-]+/g,' ').trim();
  if(!local||local.length<2) return '';
  return local.replace(/\b\w/g,c=>c.toUpperCase());
}

// Resolve the member's real name from every place we have it. Older accounts
// have no users/ record, so chat.info and the join application are the only
// sources left. Without this the admin list showed a uid or "Member".
function memberName(uid,chat){
  const u=usersCache[uid]||{};
  // chat.info belongs to the member only. Older admin replies overwrote it
  // with the admin's own name, so ignore it when info.uid is somebody else.
  const rawInfo=(chat&&chat.info)||{};
  const info=(!rawInfo.uid||rawInfo.uid===uid)?rawInfo:{};
  const candidates=[u.fullName,u.name,info.fullName,info.name];
  for(const n of candidates){
    const name=String(n==null?'':n).trim();
    if(name&&name.toLowerCase()!=='member'&&name.toLowerCase()!=='no name') return name;
  }
  const msgs=(chat&&chat.messages)||{};
  const keys=Object.keys(msgs).sort((a,b)=>(msgs[b].time||0)-(msgs[a].time||0));
  for(const k of keys){
    const m=msgs[k];
    if(m&&m.senderId===uid&&m.senderEmail){
      const fromEmail=emailToName(m.senderEmail);
      if(fromEmail) return fromEmail;
    }
  }
  return uid?('Member '+uid.slice(0,4)):'Member';
}

function memberPhone(uid,chat){
  const u=usersCache[uid]||{};
  const rawInfo=(chat&&chat.info)||{};
  const info=(!rawInfo.uid||rawInfo.uid===uid)?rawInfo:{};
  return u.phone||u.phoneNumber||info.phone||info.phoneNumber||'No phone';
}

function memberCountry(uid,chat){
  const u=usersCache[uid]||{};
  const rawInfo=(chat&&chat.info)||{};
  const info=(!rawInfo.uid||rawInfo.uid===uid)?rawInfo:{};
  return u.country||info.country||'';
}

function loadChats(){
  const listEl=document.getElementById('membersList');
  let fallbackDone=false;
  
  const doFallback=()=>{
    if(fallbackDone)return;
    fallbackDone=true;
    renderFallbackChannel();
  };
  
  if(!myId){
    doFallback();
    return;
  }

  const chatsRef=ref(db,'chats');
  onValue(chatsRef,(snapshot)=>{
    try{
      if(!snapshot.exists()){doFallback();return;}
      let cards=[];let totalUnread=0;let newForMe=null;
      snapshot.forEach(chatSnap=>{
        const chatId=chatSnap.key;const chat=chatSnap.val();
        if(!chat) return;
        if(chat.hiddenFor&&chat.hiddenFor[myId]) return;
        if(!chatId.includes(myId)&&!isAdmin) return;
        if(isAdmin&&!chatId.includes(ADMIN_UID)) return;
        const otherUid=isAdmin?chatId.replace(ADMIN_UID+"_","").replace("_"+ADMIN_UID,""):ADMIN_UID;
        // Skip the admin's own chat and the old unauthenticated "guest" chat:
        // neither can be replied to from the inbox.
        if(isAdmin&&(otherUid===ADMIN_UID||otherUid==='guest')) return;
        const msgs=chat.messages||{};
        
        // Detect deleted messages or ghost messages
        const visibleKeys=Object.keys(msgs).filter(mid=>{
          const m=msgs[mid];
          return m && typeof m==='object' && !(m.deletedFor && m.deletedFor[myId]);
        });
        
        if(visibleKeys.length===0 && !chat.lastMessage){return;}
        let lastMsg={text:chat.lastMessage||"",time:chat.lastTime||0,isGhost:false};
        if(visibleKeys.length>0){
          const sorted=visibleKeys.sort((a,b)=>(msgs[a].time||0)-(msgs[b].time||0));
          const last=msgs[sorted[sorted.length-1]];
          lastMsg={text:last.text||(last.mediaType==='audio'?'🎤 Voice note':last.mediaType==='video'?'🎥 Video':'📷 Photo'),time:last.time||0,isGhost:false};
        }else if(!chat.lastMessage){
          lastMsg={text:tr('tap_admin'),time:chat.lastTime||0,isGhost:true};
        }
        if(lastMsg.isGhost) lastMsg.text=tr('tap_admin');
        const name=memberName(otherUid,chat);
        const phone=memberPhone(otherUid,chat);
        const country=memberCountry(otherUid,chat);
        const seenAdmin=seenTime(chat.seenByAdmin);
        const seenMember=seenTime(chat.seenByMember);
        
        // Badge logic: count strictly UNREAD messages
        let unread=0;
        if(currentChatId !== chatId){
          if(isAdmin){
            visibleKeys.forEach(mid=>{const m=msgs[mid];if(m.senderId!==ADMIN_UID&&(m.time||0)>seenAdmin) unread++;});
          }else{
            visibleKeys.forEach(mid=>{const m=msgs[mid];if(m.senderId===ADMIN_UID&&(m.time||0)>seenMember) unread++;});
          }
        }
        
        totalUnread+=unread;
        if(unread>0&&!newForMe){
          const sortedKeys=visibleKeys.sort((a,b)=>(msgs[a].time||0)-(msgs[b].time||0));
          for(let i=sortedKeys.length-1;i>=0;i--){
            const m=msgs[sortedKeys[i]];
            if(isAdmin&&m.senderId!==ADMIN_UID&&(m.time||0)>seenAdmin){newForMe={msg:m,mid:sortedKeys[i],other:otherUid,isFromAdmin:false,name};break;}
            if(!isAdmin&&m.senderId===ADMIN_UID&&(m.time||0)>seenMember){newForMe={msg:m,mid:sortedKeys[i],other:ADMIN_UID,isFromAdmin:true,name};break;}
          }
        }
        let preview=lastMsg.text;
        if(lastMsg.isGhost) preview=tr('tap_admin');
        cards.push({chatId,otherUid:otherUid,name,phone,country,lastText:preview,lastTime:lastMsg.time||chat.lastTime||0,unreadCount:unread,isUnread:unread>0,initials:name.slice(0,2).toUpperCase(),isGhost:!!lastMsg.isGhost});
      });
      
      if(cards.length===0){doFallback();return;}
      fallbackDone=true;cards.sort((a,b)=>b.lastTime-a.lastTime);
      setBadge("notifCount",totalUnread);setBadge("globalChatBadge",totalUnread);updateAppIcon();
      
      if(newForMe){
        const txt=newForMe.msg.text||(newForMe.msg.mediaType==='audio'?'🎤 Voice note':newForMe.msg.mediaType==='video'?'🎥 Video':'📷 Photo');
        const otherName=newForMe.name||memberName(newForMe.other,null)||"Member";
        if(newForMe.isFromAdmin){
          if(!isAdmin){window.LodgeNotifier?.showPopup("Director",txt,"admin_message",{id:newForMe.mid});}
        }else{
          if(isAdmin){window.LodgeNotifier?.showPopup(otherName,txt,"member_message",{id:newForMe.mid});}
        }
      }
      const realCards=cards.filter(c=>!c.isGhost);
      if(isAdmin&&realCards.length===0){listEl.innerHTML=`<div style="padding:40px;text-align:center;color:#aaa">${tr('no_members')}<br><small>All chats deleted</small></div>`;setBadge("notifCount",0);setBadge("globalChatBadge",0);updateAppIcon();if(window.LodgeNotifier)window.LodgeNotifier.setAppIconBadge(0);return;}
      const displayCards=isAdmin?realCards:cards;
      if(isAdmin){
        let html='';displayCards.forEach(c=>{html+=`<div class="member-item ${c.isUnread?'new-msg':''}" data-chatid="${c.chatId}" data-other="${c.otherUid}"><div style="width:46px;height:46px;border-radius:50%;background:#121D33;border:2px solid ${c.isUnread?'#00ff88':'#D4B16A'};display:grid;place-items:center;color:${c.isUnread?'#00ff88':'#D4B16A'};font-weight:800">${c.initials}</div><div style="flex:1;overflow:hidden;text-align:left"><b style="color:${c.isUnread?'#00ff88':'#D4B16A'}">${c.name}</b><br><small style="color:#D4B16A"><i class="fa fa-phone"></i> ${c.phone} • ${c.country}</small><br><small style="color:${c.isUnread?'#fff':'#aaa'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${c.lastText}</small></div>${c.unreadCount>0?`<div class="badge">${c.unreadCount}</div>`:`<i class="fa fa-chevron-right" style="color:#D4B16A"></i>`}</div>`;});
        listEl.innerHTML=html;
      }else{
        const c=displayCards[0];
        listEl.innerHTML=`<div class="member-item ${c.isUnread?'new-msg':''}" data-chatid="${c.chatId}" data-other="${ADMIN_UID}" style="border:2px solid ${c.isUnread?'#00ff88':'var(--gold)'}"><div style="width:48px;height:48px;border-radius:50%;background:#0b1728;border:2px solid ${c.isUnread?'#00ff88':'var(--gold)'};display:grid;place-items:center"><img src="masonic-icon.png" style="width:28px"></div><div style="flex:1;overflow:hidden"><b style="color:${c.isUnread?'#00ff88':'var(--gold)'}">${tr('admin_channel')}</b><br><small style="color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${c.lastText}</small></div>${c.unreadCount>0?`<div class="badge">${c.unreadCount}</div>`:`<i class="fa fa-shield-alt" style="color:var(--gold)"></i>`}</div>`;
      }
      attachItemEvents();
    }catch(e){doFallback();}
  },(err)=>{
    doFallback();
  });
}

window.openChat=async(otherUid,displayName)=>{
  const chatId=isAdmin?(ADMIN_UID+"_"+otherUid):(ADMIN_UID+"_"+(myId||'guest'));
  currentChatId=chatId;
  let peerName;
  if(isAdmin){
    // The admin must see who wrote: the list passes the real member name, and
    // URL opens fall back to the stored profile.
    peerName=String(displayName||'').trim();
    if(!peerName||peerName==='Member'||peerName===otherUid||/^Member [A-Za-z0-9]{4}$/.test(peerName)){
      let chatData=null;
      try{const cs=await get(ref(db,'chats/'+chatId));chatData=cs.exists()?cs.val():null;}catch(e){}
      peerName=memberName(otherUid,chatData);
    }
  }else{
    // Members talk to the channel, never to the admin as a person.
    peerName=tr('admin_channel');
  }
  document.getElementById('chatName').innerText=peerName;
  document.getElementById('chatPage').style.display='flex';
  const box=document.getElementById('messages');
  
  // Instant clearance of badges when chat opens
  setBadge("notifCount",0);
  setBadge("globalChatBadge",0);
  updateAppIcon();
  if(window.LodgeNotifier)window.LodgeNotifier.setAppIconBadge(0);

  try{if(isAdmin)await update(ref(db,`chats/${chatId}`),{seenByAdmin:Date.now()}).catch(()=>{});else await update(ref(db,`chats/${chatId}`),{seenByMember:Date.now()}).catch(()=>{});}catch(e){}

  if(chatUnsubscribe){chatUnsubscribe();chatUnsubscribe=null;}
  chatUnsubscribe=onValue(ref(db,`chats/${chatId}/messages`),(snap)=>{
    const data=snap.val()||{};
    const ids=Object.keys(data).filter(mid=>{
      const m=data[mid];
      return m && typeof m==='object' && !(m.deletedFor&&m.deletedFor[myId]);
    }).sort((a,b)=>(data[a].time||0)-(data[b].time||0));

    if(ids.length===0){
      const empty=document.createElement('div');
      empty.style.cssText='text-align:center;padding:60px 20px;color:#aaa';
      empty.innerHTML=`<div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(145deg,#121D33,#0b1728);border:2px solid var(--gold);display:grid;place-items:center;margin:0 auto 20px"><i class="fa fa-comments" style="font-size:32px;color:var(--gold)"></i></div><div style="color:var(--gold);font-weight:700;font-size:16px">${tr('no_messages')}</div><div style="font-size:12px;margin-top:8px;color:#666">Start your conversation with ${peerName}<br>Your messages are secured</div><div style="margin-top:20px;color:#333;font-size:11px"><i class="fa fa-lock"></i> End-to-end encrypted</div>`;
      box.replaceChildren(empty);
      return;
    }

    // Build the entire list off-DOM and swap it in atomically. Firebase can
    // re-enter this listener while status writes are in flight; the old code
    // cleared the box and appended inside the loop, so overlapping renders
    // stacked the same DB message 2-3 times. replaceChildren() cannot stack.
    const frag=document.createDocumentFragment();
    const statusUpdates={};
    ids.forEach(mid=>{
      const m=data[mid];
      const isMe=m.senderId===myId;
      // Collect status changes; write them once after the DOM is stable.
      if(!isMe && m.status!=='read') statusUpdates[`chats/${chatId}/messages/${mid}/status`]='read';

      const wrap=document.createElement('div');wrap.className='msg-wrap';wrap.style.justifyContent=isMe?'flex-end':'flex-start';
      const icon=document.createElement('div');icon.className='reply-icon';icon.innerHTML='<i class="fa fa-reply"></i>';
      const div=document.createElement('div');div.className='msg '+(isMe?'my-msg':'other-msg');
      let html='';if(m.replyTo){html+=`<div class="reply-preview"><b style="color:var(--gold)">${m.replyTo.name}</b><br>${String(m.replyTo.text||'').slice(0,60)}</div>`;}
      if(m.mediaUrl){
        if(m.mediaType==='video'){html+=`<div class="media-box"><video src="${m.mediaUrl}" controls style="max-width:260px;border-radius:12px"></video><div class="media-down" onclick="event.stopPropagation();window.downloadUrl('${m.mediaUrl}','video.mp4')"><i class="fa fa-download"></i></div></div>`;}
        else if(m.mediaType==='audio'){html+=`<div class="media-box" style="background:transparent"><audio src="${m.mediaUrl}" controls preload="metadata" style="max-width:250px;width:100%"></audio><div class="media-down" onclick="event.stopPropagation();window.downloadUrl('${m.mediaUrl}','voice-note')"><i class="fa fa-download"></i></div></div>`;}
        else{html+=`<div class="media-box"><img src="${m.mediaUrl}" style="max-width:260px;border-radius:12px"><div class="media-down" onclick="event.stopPropagation();window.downloadUrl('${m.mediaUrl}','photo.jpg')"><i class="fa fa-download"></i></div></div>`;}
      }
      let tick='';if(isMe){if(m.status==='read')tick=`<span class="tick tick-read">✓✓</span>`;else if(m.status==='delivered')tick=`<span class="tick tick-delivered">✓✓</span>`;else tick=`<span class="tick tick-sent">✓</span>`;}
      html+=`${m.text||''}<span style="font-size:8px;opacity:.6;float:right;margin-left:6px;margin-top:4px">${new Date(m.time||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>${tick}`;
      div.innerHTML=html;
      // In the admin inbox every incoming bubble carries the member's name, so
      // there is never a question about who wrote it.
      let langAnchor=div.firstChild;
      if(isAdmin&&!isMe){
        const sender=document.createElement('div');
        sender.className='msg-sender';
        sender.textContent=peerName;
        div.insertBefore(sender,div.firstChild);
        langAnchor=sender.nextSibling;
      }
      // Automatically label a foreign-language message so the admin knows what
      // it is before tapping. No network call is needed for this hint.
      if(isAdmin&&!isMe&&m.text){
        const detected=heuristicLang(m.text);
        if(detected&&detected!=='en'){
          const chip=document.createElement('button');
          chip.type='button';
          chip.className='msg-lang';
          chip.textContent='🌐 '+langLabel(detected);
          chip.title='Tap to translate to English or Kiswahili';
          chip.addEventListener('click',e=>{e.stopPropagation();translateBubble(div,m.text,'auto');});
          div.insertBefore(chip,langAnchor);
        }
      }
      div.dataset.mid=mid;

      // Tap a bubble to translate it in place. Long-press and swipe are
      // suppressed so they still open the menu / reply bar.
      div.addEventListener('click',e=>{
        if(e.target.closest('.media-down')||e.target.closest('audio')||e.target.closest('video')||e.target.closest('a')||e.target.closest('.msg-translation'))return;
        if(div.dataset.suppressTap==='1'){div.dataset.suppressTap='0';return;}
        if(m.text) translateBubble(div,m.text);
      });
      div.addEventListener('contextmenu',e=>{e.preventDefault();showMsgMenu(e,mid,m.text||'Media',isMe,m.mediaUrl||null);});
      let sx=0,cx=0,sw=false,lt=null;
      div.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sw=true;cx=0;div.classList.add('swiping');lt=setTimeout(()=>{div.dataset.suppressTap='1';showMsgMenu(e,mid,m.text||'Media',isMe,m.mediaUrl||null);sw=false;},600);},{passive:true});
      div.addEventListener('touchmove',e=>{if(!sw)return;const d=e.touches[0].clientX-sx;if(Math.abs(d)>12)clearTimeout(lt);if(d>0&&d<110){cx=d;div.style.transform=`translateX(${cx}px)`;icon.style.opacity=Math.min(cx/60,1);}},{passive:true});
      div.addEventListener('touchend',()=>{clearTimeout(lt);if(!sw)return;sw=false;div.classList.remove('swiping');if(cx>55){div.dataset.suppressTap='1';setReply(m.text||'📷 Media',isMe?'You':document.getElementById('chatName').innerText);}div.style.transform='translateX(0)';icon.style.opacity='0';cx=0;});

      wrap.appendChild(icon);wrap.appendChild(div);frag.appendChild(wrap);
    });

    box.replaceChildren(frag);
    box.scrollTop=box.scrollHeight;

    const statusKeys=Object.keys(statusUpdates);
    if(statusKeys.length){
      // One deferred multi-path update instead of N updates inside the loop.
      setTimeout(()=>{update(ref(db),statusUpdates).catch(()=>{});},0);
    }
  },()=>{box.innerHTML=`<div style="padding:40px;text-align:center;color:#ff5a5a">Error loading<br><small>Check Firebase Rules</small></div>`;});
}

document.getElementById('mediaInput').addEventListener('change',async(e)=>{
  if(isSending) return;
  const file=e.target.files[0];if(!file||!currentChatId)return;
  const chatId=currentChatId;
  const fileKey=[file.name,file.size,file.lastModified].join(':');
  const replyKey=JSON.stringify(replyData||null);
  isSending=true;
  const box=document.getElementById('messages');const tempId='temp_'+Date.now();const localUrl=URL.createObjectURL(file);const isVideo=file.type.startsWith('video');
  const wrap=document.createElement('div');wrap.id=tempId;wrap.className='msg-wrap';wrap.style.justifyContent='flex-end';wrap.innerHTML=`<div class="msg my-msg"><div class="media-box">${isVideo?`<video src="${localUrl}" style="max-width:260px;border-radius:12px" muted></video>`:`<img src="${localUrl}" style="max-width:260px;border-radius:12px">`}</div><span style="font-size:8px;opacity:.6;float:right">Uploading...</span><span class="tick tick-sent">✓</span></div>`;box.appendChild(wrap);box.scrollTop=box.scrollHeight;
  try{
    let pending=readPending(chatId,'media');
    if(!(pending&&pending.fileKey===fileKey&&pending.replyKey===replyKey&&pending.payload?.senderId===myId)){
      let finalUrl='';let mediaType=isVideo?'video':'image';
      if(isVideo){if(file.size>15*1024*1024){showToast('Video max 15MB');document.getElementById(tempId)?.remove();isSending=false;return;}finalUrl=await uploadMediaBlob(file);}
      else{finalUrl=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;const MAX=700;if(w>MAX||h>MAX){if(w>h){h=h*(MAX/w);w=MAX;}else{w=w*(MAX/h);h=MAX;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.55));};img.onerror=()=>res(ev.target.result);img.src=ev.target.result;};rd.onerror=rej;rd.readAsDataURL(file);});}
      const payload={senderId:myId,senderEmail:myEmail,text:document.getElementById('msgInput').value.trim(),mediaUrl:finalUrl,mediaType,time:Date.now(),status:'sent'};if(replyData)payload.replyTo=replyData;
      pending={id:newMessageId(),fileKey,replyKey,payload,preview:mediaType==='video'?'🎥 Video':'📷 Photo'};
      writePending(chatId,'media',pending);
    }
    await commitMessage(chatId,'media',pending);
    document.getElementById(tempId)?.remove();document.getElementById('msgInput').value='';cancelReply();
  }catch(err){showToast('Failed: '+err.message);document.getElementById(tempId)?.remove();}
  finally{isSending=false;}
  e.target.value='';
});

// Single message transmission guard + retry-safe message IDs
window.sendMsg=async()=>{
  if(isSending) return;
  const i=document.getElementById('msgInput');const txt=i.value.trim();if(!txt||!currentChatId)return;
  const chatId=currentChatId;
  const replyKey=JSON.stringify(replyData||null);
  const sendSig=chatId+'|'+txt+'|'+replyKey;
  const now=Date.now();
  if(sendSig===lastSendSig&&now-lastSendAt<2500)return;
  lastSendSig=sendSig;lastSendAt=now;
  isSending=true;
  try{
    let pending=readPending(chatId,'text');
    if(!(pending&&pending.payload?.text===txt&&pending.replyKey===replyKey&&pending.payload?.senderId===myId)){
      const payload={text:txt,senderId:myId,senderEmail:myEmail,time:Date.now(),status:'sent'};if(replyData)payload.replyTo=replyData;
      pending={id:newMessageId(),replyKey,payload,preview:txt};
      writePending(chatId,'text',pending);
    }
    await commitMessage(chatId,'text',pending);
    i.value="";cancelReply();
  }catch(e){showToast('Failed to send');}
  finally{isSending=false;}
}

// ---------- TAP-TO-TRANSLATE (any language <-> any language) ----------
const LANG_MAP={en:'en',sw:'sw',lg:'lg',rw:'rw',pt:'pt',fr:'fr',zu:'zu',ha:'ha',tw:'ak',am:'am',sn:'sn',bem:'bem',tn:'tn',ng:'ny',hi:'hi'};
const LANG_NAMES={en:'English',sw:'Kiswahili',lg:'Luganda',rw:'Kinyarwanda',fr:'Français',pt:'Português',zu:'isiZulu',ha:'Hausa',am:'Amharic',hi:'Hindi',ar:'العربية',es:'Español',ak:'Akan',sn:'Shona',bem:'Bemba',tn:'Setswana',ny:'Chichewa',it:'Italiano',de:'Deutsch',ru:'Русский',el:'Ελληνικά',he:'עברית',th:'ไทย',ja:'日本語','zh-CN':'中文',ko:'한국어',uk:'Українська',tr:'Türkçe',nl:'Nederlands'};
const QUICK_TARGETS=[['en','English'],['sw','Kiswahili']];
function targetLang(){const l=getLang();return LANG_MAP[l]||l||'en';}
function getTranslateTarget(){
  try{const saved=localStorage.getItem('mffTranslateTarget');if(saved)return saved;}catch(e){}
  return targetLang();
}
function langLabel(code){
  const c=String(code||'').toLowerCase();
  if(!c||c==='auto')return '';
  return LANG_NAMES[c]||c.toUpperCase();
}

// Google's auto-detect is unreliable for short messages ("gracias" is often
// called English). Script checks + distinctive stop-words give us a solid
// source language before we translate, so Spanish/Luganda/etc. stay correct.
const SCRIPT_LANGS=[
  [/[\u0600-\u06FF]/, 'ar'],
  [/[\u0900-\u097F]/, 'hi'],
  [/[\u1200-\u137F]/, 'am'],
  [/[\u0400-\u04FF]/, 'ru'],
  [/[\u0370-\u03FF]/, 'el'],
  [/[\u0590-\u05FF]/, 'he'],
  [/[\u0E00-\u0E7F]/, 'th'],
  [/[\u3040-\u30FF]/, 'ja'],
  [/[\u4E00-\u9FFF]/, 'zh-CN'],
  [/[\uAC00-\uD7AF]/, 'ko']
];
const LANG_WORDS={
  es:'gracias hola buenos buenas dias noches amigo amiga hermano hermana como estas esta que tal hasta luego adios bienvenido senor senora donde cuando porque pero mucho muy tambien usted nosotros ellos ella necesito quiero puedes ayuda mensaje iglesia familia',
  fr:'bonjour merci salut vous plait comment allez frere soeur bienvenue oui avec pour mais tres aussi nous ils elle besoin aider message eglise famille revoir',
  pt:'obrigado obrigada ola voce voces nao sim bom boa dia noite irmao irma bemvindo como esta tudo bem ate logo porque mas muito tambem nos eles ela preciso quero pode ajuda mensagem igreja familia',
  it:'grazie ciao buongiorno buonasera come stai fratello sorella chiesa famiglia messaggio favore scusa bene molto anche noi loro bisogno aiuto',
  de:'danke hallo guten tag wie geht bruder schwester kirche familie nachricht bitte entschuldigung sehr auch wir sie hilfe',
  sw:'asante sana habari karibu ndiyo hapana mimi wewe yeye sisi nyinyi wao nzuri vizuri salama rafiki ndugu dada kaka kanisa familia ujumbe tafadhali samahani pole sawa nini lakini pia',
  lg:'webale weebale nyo oli otya kiki nze ggwe ffe mmwe bulungi mirembe mukama owange ssebo nyabo kino kiri naye ate era nnyo kusiima ekkanisa amaka obubaka',
  rw:'murakoze mwaramutse mwiriwe amakuru meza ndabyemeye yego oya ndumva ubwo ariko kandi cyane umuryango ubutumwa itorero murakaza neza',
  zu:'ngiyabonga sawubona unjani yebo cha ngiyaphila wena mina thina nina bona kahle kakhulu umzalwane udade umfowethu ibandla umndeni umyalezo ngicela uxolo',
  ha:'gode sannu yaya lafiya barka zuwa gida coci iyali sako allah ina kwana yini'
};
function normalizeWord(w){
  return String(w||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9']/g,'');
}
function heuristicLang(text){
  const raw=String(text||'');
  for(const [re,lang] of SCRIPT_LANGS){ if(re.test(raw)) return lang; }
  const words=raw.toLowerCase().replace(/[^\p{L}\s']/gu,' ').split(/\s+/).filter(Boolean);
  if(!words.length) return '';
  let best='',bestScore=0,second=0;
  for(const lang of Object.keys(LANG_WORDS)){
    const set=new Set(LANG_WORDS[lang].split(/\s+/).map(normalizeWord));
    let score=0;
    for(const w of words){ if(set.has(normalizeWord(w))) score++; }
    if(score>bestScore){second=bestScore;best=lang;bestScore=score;}
    else if(score>second){second=score;}
  }
  if(!bestScore||bestScore<=second) return '';
  const ratio=bestScore/words.length;
  if(bestScore>=2) return best;
  if(words.length<=2) return best;
  return ratio>=0.5?best:'';
}
function decodeEntities(s){const t=document.createElement('textarea');t.innerHTML=String(s||'');return t.value;}
function sameText(a,b){return String(a||'').replace(/\s+/g,' ').trim().toLowerCase()===String(b||'').replace(/\s+/g,' ').trim().toLowerCase();}
async function googleTranslate(q,sl,tl){
  try{
    const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}&dt=t&q=${encodeURIComponent(q)}`,{cache:'no-store'});
    if(!r.ok)return {text:'',source:''};
    const d=await r.json();
    const text=(d&&d[0]?d[0].map(p=>p&&p[0]||'').join(''):'').trim();
    const source=(d&&typeof d[2]==='string')?d[2]:'';
    return {text,source};
  }catch(e){return {text:'',source:''};}
}
async function myMemoryTranslate(q,sl,tl){
  try{
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${encodeURIComponent(sl)}%7C${encodeURIComponent(tl)}`,{cache:'no-store'});
    if(!r.ok)return '';
    const d=await r.json();
    const out=decodeEntities(((d&&d.responseData&&d.responseData.translatedText)||'').trim());
    if(!out||/^MYMEMORY WARNING/i.test(out))return '';
    return out;
  }catch(e){return '';}
}
async function translateText(text,tl){
  const q=String(text||'').trim();
  if(!q)return {text:'',source:''};
  const guessed=heuristicLang(q);

  // If we know the source, translate with it explicitly. This is what makes
  // short words like "gracias" reliably come out as Spanish, not English.
  if(guessed&&guessed!==tl){
    const g=await googleTranslate(q,guessed,tl);
    if(g.text&&!sameText(g.text,q))return {text:g.text,source:guessed};
  }

  const g=await googleTranslate(q,'auto',tl);
  if(g.text){
    const source=guessed||g.source||'';
    if(source===tl)return {text:q,source};
    if(!sameText(g.text,q))return {text:g.text,source};
    if(source)return {text:g.text,source};
  }

  // Fallbacks when Google is unreachable or cannot handle the pair.
  const candidates=guessed?[guessed]:['lg','sw','rw','es','fr','pt'];
  for(const sl of candidates){
    if(sl===tl)continue;
    const t=await myMemoryTranslate(q,sl,tl);
    if(t&&!sameText(t,q))return {text:t,source:sl};
  }
  return {text:g.text||'',source:guessed||g.source||''};
}
async function runBubbleTranslation(div,text,tl){
  const block=div.querySelector('.msg-translation');
  if(!block)return;
  const body=block.querySelector('.tr-text');
  const label=block.querySelector('.tr-source');
  const actions=block.querySelector('.tr-actions');
  if(body)body.textContent='Detecting language…';
  if(label)label.textContent='';
  div.dataset.translating='1';
  try{
    let res;
    let target=tl;
    if(!target||target==='auto'){
      // Translating to English also tells us the detected source language.
      res=await translateText(text,'en');
      const source=String(res.source||'').toLowerCase();
      // Foreign message -> English. English message -> Kiswahili.
      target=(source==='en')?'sw':'en';
      if(target==='sw')res=await translateText(text,'sw');
    }else{
      res=await translateText(text,target);
    }
    const source=String(res.source||'').toLowerCase();
    block.dataset.target=target;
    const sourceName=langLabel(source);
    const targetName=langLabel(target);
    if(label){
      if(sourceName&&source===target)label.textContent=sourceName;
      else if(sourceName)label.textContent='Detected: '+sourceName+' → '+targetName;
      else label.textContent='Translate to '+targetName;
    }
    if(body)body.textContent=res.text||'Translation unavailable';
    if(actions){
      actions.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.lang===target));
    }
  }catch(e){
    if(body)body.textContent='Translation unavailable';
  }finally{
    div.dataset.translating='0';
  }
}
async function translateBubble(div,text,targetOverride){
  if(!div||!text||!String(text).trim())return;
  const existing=div.querySelector('.msg-translation');
  if(existing&&!targetOverride){existing.remove();return;}
  if(div.dataset.translating==='1'&&!targetOverride)return;
  let block=existing;
  if(!block){
    block=document.createElement('div');
    block.className='msg-translation';
    const head=document.createElement('div');head.className='tr-head';
    const icon=document.createElement('span');icon.textContent='🌐';
    const label=document.createElement('span');label.className='tr-source';
    const close=document.createElement('span');close.className='tr-close';close.textContent='×';close.title='Close translation';
    close.addEventListener('click',e=>{e.stopPropagation();block.remove();});
    head.appendChild(icon);head.appendChild(label);head.appendChild(close);

    // Only the two languages the lodge needs. The first translation is
    // chosen automatically from the detected source language.
    const actions=document.createElement('div');actions.className='tr-actions';
    QUICK_TARGETS.forEach(([code,name])=>{
      const b=document.createElement('button');b.type='button';b.dataset.lang=code;b.textContent=name;
      b.addEventListener('click',e=>{e.stopPropagation();runBubbleTranslation(div,text,code);});
      actions.appendChild(b);
    });

    const body=document.createElement('div');body.className='tr-text';
    block.appendChild(head);block.appendChild(actions);block.appendChild(body);
    div.appendChild(block);
  }
  await runBubbleTranslation(div,text,targetOverride||'auto');
}
window.translateSelected=()=>{
  const div=selId?document.querySelector(`.msg[data-mid="${selId}"]`):null;
  if(div&&selText)translateBubble(div,selText);
  hideMenus();
};
