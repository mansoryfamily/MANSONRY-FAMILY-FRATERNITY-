<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL ADMIN PANEL - Freemasonry Heritage</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#080E1F;--card:#121D33;--border:#1E2E4F;--gold:#D4B16A;--gold2:#F0D185}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:14px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--border)}
.insta-ring{width:42px;height:42px;border-radius:12px;padding:2px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:grid;place-items:center}
.insta-inner{width:100%;height:100%;background:#0b1728;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.insta-inner img{width:26px;height:26px;object-fit:contain}
#membersList{flex:1;overflow-y:auto;padding:8px}
.member-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin:8px 0;cursor:pointer}
.member-item:hover{border-color:var(--gold)}
.member-item b{color:var(--gold);font-size:13px}
.member-item small{color:#8A9BB5;font-size:10px}
#chatPage{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;background:radial-gradient(circle,#111E36,#080E1F)}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;margin:5px 0;font-size:13px;word-break:break-word;cursor:pointer;position:relative}
.my-msg{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000;margin-left:auto;align-self:flex-end;border-bottom-right-radius:3px}
.other-msg{background:var(--card);border:1px solid var(--border);margin-right:auto;align-self:flex-start;border-bottom-left-radius:3px}
.input-area{background:var(--card);border-top:1px solid var(--border);padding:8px 10px;display:flex;gap:8px;align-items:center}
.input-area input{flex:1;background:#0A1428;border:1px solid var(--border);color:#fff;padding:11px 15px;border-radius:25px;outline:none}
.icon-btn{background:var(--gold);color:#000;width:42px;height:42px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer}
#ctxMenu{position:fixed;z-index:100;background:#1a2a4a;border:1px solid var(--gold);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:160px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#ctxMenu button{background:var(--card);border:1px solid var(--border);color:#fff;padding:10px;border-radius:9px;text-align:left;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
#ctxMenu button:hover{background:var(--gold);color:#000}
</style>
</head><body>

<div class="top">
  <div style="display:flex;align-items:center;gap:10px">
    <i class="fa fa-arrow-left" style="color:var(--gold);font-size:18px;cursor:pointer" onclick="location.href='help.html'"></i>
    <div class="insta-ring"><div class="insta-inner"><img src="masonic-icon.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2091/2091665.png'"></div></div>
    <div><div style="color:var(--gold);font-weight:800;font-size:13px;line-height:1.1">GLOBAL ADMIN<br>PANEL</div><small id="sub" style="color:#00ff88;font-size:9px">Syncing...</small></div>
  </div>
  <div id="roleBtn" style="font-size:9px;background:var(--gold);color:#000;padding:6px 10px;border-radius:15px;font-weight:800">...</div>
</div>

<div id="membersList"><div style="text-align:center;color:#aaa;padding:30px">Loading from ROOT DB...</div></div>

<div id="chatPage">
  <div style="background:var(--card);padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)">
    <i class="fa fa-arrow-left" style="color:var(--gold);font-size:18px;cursor:pointer" onclick="closeChat()"></i>
    <img src="https://cdn-icons-png.flaticon.com/512/2091/2091665.png" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--gold)">
    <div style="flex:1"><h4 id="chatName" style="color:var(--gold);font-size:13px"></h4><small style="color:#00ff88;font-size:9px">● Encrypted • Real-time</small></div>
    <small id="chatIdShow" style="font-size:6px;color:#555"></small>
  </div>
  <div id="messages"></div>
  <div class="input-area"><input id="msgInput" placeholder="Type message..." onkeypress="if(event.key==='Enter')sendMsg()"><button class="icon-btn" onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button></div>
</div>

<div id="ctxMenu">
  <button onclick="copyMsg()"><i class="fa fa-copy"></i> Copy</button>
  <button id="editBtn" onclick="editMsg()"><i class="fa fa-pen"></i> Edit</button>
  <button onclick="deleteMsg()" style="color:#ff5a5a"><i class="fa fa-trash"></i> Delete</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

// ✅ YOUR CONFIG INJECTED - FOR REALTIME DB SYNC
const firebaseConfig = {
  apiKey: "AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",
  authDomain: "mansonry-family-fraternity.firebaseapp.com",
  databaseURL: "https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mansonry-family-fraternity",
  storageBucket: "mansonry-family-fraternity.firebasestorage.app",
  messagingSenderId: "964415179161",
  appId: "1:964415179161:web:c8fd1a777542932d7c6b08",
  measurementId: "G-Q8LC74ZFXN"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const ADMIN_EMAIL = "mansoryfamilyn@gmail.com";
const ADMIN_UID = "DMeM2UuLgDOusNvmzRGZygBdxOG2"; // Your admin UID from screenshot

let myId=null, myEmail="", isAdmin=false, currentChatId=null;
let selId=null, selText=null;

onAuthStateChanged(auth, (user)=>{
  if(!user){
    document.getElementById('membersList').innerHTML='<div style="text-align:center;padding:40px"><a href="login.html" style="color:var(--gold)">Please login first</a></div>';
    return;
  }
  myId=user.uid;
  myEmail=(user.email||"").toLowerCase();
  isAdmin=(myEmail===ADMIN_EMAIL);
  document.getElementById('roleBtn').innerText = isAdmin? 'ADMIN' : 'MEMBER';
  document.getElementById('sub').innerText = isAdmin? 'ADMIN MODE: '+myEmail+' • ROOT SYNC' : 'MEMBER MODE: '+myEmail+' • Admin only';
  loadUsers();
});

function loadUsers(){
  // ✅ YOUR DB IS AT ROOT "/" - NOT "/members" - Fixed for your screenshot
  onValue(ref(db,'/'), (snap)=>{
    const raw=snap.val()||{};
    const list=document.getElementById('membersList');
    list.innerHTML="";
    const users = Object.keys(raw).filter(k=> typeof raw[k]==='object' && raw[k]!==null && raw[k].email).map(k=> ({dbKey:k,...raw[k]}));
    let adminUsers = users.filter(u=> u.email.toLowerCase()===ADMIN_EMAIL || u.role==='admin');
    if(adminUsers.length===0) adminUsers=[{dbKey:ADMIN_UID, uid:ADMIN_UID, fullName:'Mansory Family Director', email:ADMIN_EMAIL, phone:'0794280683', role:'admin'}];

    if(isAdmin){
      users.forEach(u=>{
        if((u.uid||u.dbKey)===myId || u.email.toLowerCase()===ADMIN_EMAIL) return;
        const name=u.fullName||'Member';
        list.innerHTML+=`<div class="member-item" onclick="openChat('${u.uid||u.dbKey}','${name.replace(/'/g,'')}')">
          <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=121D33&color=D4B16A" style="width:42px;height:42px;border-radius:50%;border:2px solid var(--gold)">
          <div style="flex:1"><b>${name}</b><br><small>${u.email} • ${u.phone||''} • ${u.country||''}</small></div>
          <i class="fa fa-chevron-right" style="color:var(--gold);font-size:12px"></i>
        </div>`;
      });
      if(list.innerHTML==="") list.innerHTML='<div style="text-align:center;padding:30px;color:#aaa">No other members in ROOT DB</div>';
    } else {
      adminUsers.forEach(u=>{
        const name=u.fullName||'Administration';
        list.innerHTML+=`<div class="member-item" style="border-color:var(--gold)" onclick="openChat('${u.uid||u.dbKey}','${name}')">
          <img src="https://cdn-icons-png.flaticon.com/512/2091/2091665.png" style="width:42px;height:42px;border-radius:50%;border:2px solid var(--gold)">
          <div style="flex:1"><b>${name} <span style="background:var(--gold);color:#000;font-size:8px;padding:2px 6px;border-radius:8px">ADMIN</span></b><br><small style="color:#00ff88">${u.email} • Tap to message</small></div>
          <i class="fa fa-comment-dots" style="color:var(--gold)"></i>
        </div>`;
      });
    }
  });
}

window.openChat=(otherUid, name)=>{
  // ✅ FIXED CHAT ID - SAME FOR BOTH SIDES
  if(isAdmin){ currentChatId = ADMIN_UID + "_" + otherUid; } else { currentChatId = ADMIN_UID + "_" + myId; }
  document.getElementById('chatName').innerText=name;
  document.getElementById('chatIdShow').innerText=currentChatId.slice(0,12)+'...';
  document.getElementById('chatPage').style.display='flex';

  onValue(ref(db,`chats/${currentChatId}/messages`), (snap)=>{
    const box=document.getElementById('messages'); box.innerHTML="";
    const data=snap.val()||{};
    Object.keys(data).forEach(mid=>{
      const m=data[mid]; const isMe=m.senderId===myId;
      const div=document.createElement('div');
      div.className='msg '+(isMe?'my-msg':'other-msg');
      div.innerHTML=`${m.text}<span style="font-size:8px;opacity:.6;float:right;margin-left:6px;margin-top:4px">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;
      div.addEventListener('contextmenu', e=>{ e.preventDefault(); showMenu(e,mid,m.text,isMe); });
      let t; div.addEventListener('touchstart', e=>{ t=setTimeout(()=>showMenu(e,mid,m.text,isMe),600); }); div.addEventListener('touchend',()=>clearTimeout(t));
      box.appendChild(div);
    });
    box.scrollTop=box.scrollHeight;
  });
}

function showMenu(e, mid, text, isMine){
  selId=mid; selText=text;
  const menu=document.getElementById('ctxMenu');
  const x=e.touches?e.touches[0].clientX:e.clientX; const y=e.touches?e.touches[0].clientY:e.clientY;
  menu.style.left=(x-80)+'px'; menu.style.top=y+'px'; menu.style.display='flex';
  document.getElementById('editBtn').style.display=isMine?'flex':'none';
}
window.copyMsg=()=>{ navigator.clipboard.writeText(selText); hideMenu(); }
window.deleteMsg=async()=>{ if(confirm('Delete this message?')) await remove(ref(db,`chats/${currentChatId}/messages/${selId}`)); hideMenu(); }
window.editMsg=async()=>{ const nt=prompt('Edit message:',selText); if(nt) await update(ref(db,`chats/${currentChatId}/messages/${selId}`),{text:nt}); hideMenu(); }
function hideMenu(){ document.getElementById('ctxMenu').style.display='none'; }
document.addEventListener('click', e=>{ if(!e.target.closest('#ctxMenu')) hideMenu(); });

window.sendMsg=async()=>{
  const i=document.getElementById('msgInput'); const txt=i.value.trim(); if(!txt||!currentChatId) return;
  const r=push(ref(db,`chats/${currentChatId}/messages`));
  await set(r,{text:txt, senderId:myId, senderEmail:myEmail, time:Date.now()});
  i.value="";
}
window.closeChat=()=>document.getElementById('chatPage').style.display='none';
</script>
</body></html>
