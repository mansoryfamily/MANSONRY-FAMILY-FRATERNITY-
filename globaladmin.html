<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL ADMIN PANEL</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#080E1F;--card:#121D33;--border:#1E2E4F;--gold:#D4B16A;--gold2:#F0D185;--green:#00ff88}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:12px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#membersList{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column}
.member-item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin:6px 0;cursor:pointer}
.member-item.new-msg{border:2px solid var(--green);background:linear-gradient(145deg,#0f2a1f,#121D33)}
.badge{background:var(--green);color:#000;font-size:11px;font-weight:900;min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
#chatPage{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;background:#080E1F;gap:3px}
.msg-wrap{position:relative;width:100%;display:flex;align-items:center}
.reply-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%) scale(0.6);width:32px;height:32px;background:var(--gold);border-radius:50%;display:grid;place-items:center;color:#000;opacity:0;transition:all.2s ease;z-index:1}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;margin:4px 0;font-size:13px;cursor:pointer;transition:transform.22s ease;position:relative;z-index:2;touch-action:pan-y;user-select:none}
.msg.swiping{transition:none}
.my-msg{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000;margin-left:auto}
.other-msg{background:var(--card);border:1px solid var(--border);margin-right:auto}.reply-preview{border-left:3px solid var(--gold);background:rgba(212,177,106,.15);padding:6px 8px;border-radius:6px;margin-bottom:6px;font-size:11px}
.reply-bar{background:#0A1428;border-left:3px solid var(--gold);padding:8px 10px;display:none;justify-content:space-between;align-items:center}
.input-area{background:var(--card);border-top:1px solid var(--border);padding:8px;display:flex;gap:8px;align-items:center}
.input-area input{flex:1;background:#0A1428;border:1px solid var(--border);color:#fff;padding:11px;border-radius:20px;outline:none}
.icon-btn{background:var(--gold);color:#000;width:42px;height:42px;border-radius:50%;border:none;display:grid;place-items:center}
.menu{position:fixed;z-index:100;background:#1a2a4a;border:1px solid var(--gold);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:200px}
.menu button{background:var(--card);border:1px solid var(--border);color:#fff;padding:11px;border-radius:9px;text-align:left;display:flex;gap:10px;align-items:center;cursor:pointer}
.menu button.danger{color:#ff5a5a}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#121D33;border:1px solid var(--gold);color:#fff;padding:12px 20px;border-radius:25px;display:flex;align-items:center;gap:10px;z-index:9999;opacity:0;transition:all.35s ease}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.media-box{border-radius:12px;overflow:hidden;margin-bottom:6px;position:relative;background:#000}
.media-box img,.media-box video{width:100%;max-width:260px;max-height:320px;border-radius:12px;display:block;object-fit:cover}
.media-down{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.85);border:1px solid var(--gold);color:var(--gold);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:5}
.tick{font-size:11px;margin-left:4px;font-weight:900}
.tick-sent{color:#555}.tick-delivered{color:#888}.tick-read{color:#53bdeb}
</style>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",authDomain:"mansonry-family-fraternity.firebaseapp.com",databaseURL:"https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",projectId:"mansonry-family-fraternity",storageBucket:"mansonry-family-fraternity.firebasestorage.app",messagingSenderId:"964415179161",appId:"1:964415179161:web:c8fd1a777542932d7c6b08"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);const auth=getAuth(app);const storage=getStorage(app);
const ADMIN_EMAIL="mansoryfamilyn@gmail.com";
const ADMIN_UID="DMeM2UuLgDOusNvmzRGZygBdxOG2";
let myId=null,myEmail="",isAdmin=false,currentChatId=null,myInfo={fullName:'Member'},usersCache={},selId=null,selText=null,selIsMine=false,replyData=null,selChatId=null,selMediaUrl=null;

function showToast(msg){document.getElementById('toastText').innerText=msg;const el=document.getElementById('toast');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}
function attachItemEvents(){document.querySelectorAll('.member-item').forEach(el=>{let timer;const showM=(e)=>{e.preventDefault();selChatId=el.dataset.chatid;const menu=document.getElementById('chatMenu');menu.style.left=((e.touches?e.touches[0].clientX:e.clientX)-120)+'px';menu.style.top=(e.touches?e.touches[0].clientY:e.clientY)+'px';menu.style.display='flex';};el.addEventListener('contextmenu',showM);el.addEventListener('touchstart',e=>{timer=setTimeout(()=>showM(e),700);});el.addEventListener('touchend',()=>clearTimeout(timer));el.addEventListener('click',()=>openChat(el.dataset.other,el.querySelector('b').innerText));});}
function setBadge(id,count){const el=document.getElementById(id);if(!el)return;if(count>0){el.textContent=count>99?"99+":count;el.style.display="grid";}else{el.style.display="none";}}
function updateAppIcon(){const c1=parseInt(document.getElementById("notifCount")?.textContent||"0");const c2=parseInt(document.getElementById("notifBadge")?.textContent||"0");let total=0;if(!isNaN(c1))total+=c1;if(!isNaN(c2))total+=c2;if(window.LodgeNotifier)window.LodgeNotifier.setAppIconBadge(total);}

onAuthStateChanged(auth,async(u)=>{
  if(!u){document.getElementById('membersList').innerHTML=`<div style="padding:30px;text-align:center">Not logged in</div>`;return;}
  myId=u.uid;myEmail=(u.email||"").toLowerCase();isAdmin=(myEmail===ADMIN_EMAIL);
  document.getElementById('sub').innerText=isAdmin?"ADMIN":"LODGE";
  // Unlock voice on first click (required by Chrome)
  document.addEventListener('click',()=>{if(window.speechSynthesis){window.speechSynthesis.getVoices();}}, {once:true});
  try{const s=await get(ref(db,'users'));if(s.exists()){Object.values(s.val()).forEach(v=>{if(v&&v.uid)usersCache[v.uid]=v;});}const s2=await get(ref(db,'members'));if(s2.exists()){Object.values(s2.val()).forEach(v=>{if(v&&v.uid)usersCache[v.uid]=v;});}}catch(e){}
  myInfo=usersCache[myId]||{fullName:u.displayName||'Member'};loadChats();loadNotifications();
});
function loadNotifications(){const r=ref(db,`notifications/${myId}`);onValue(r,(snap)=>{if(!snap.exists()){setBadge("notifBadge",0);updateAppIcon();return;}let unread=0;snap.forEach(c=>{const n=c.val();if(!n.read)unread++;});setBadge("notifBadge",unread);updateAppIcon();});}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>console.log("SW registered - respecting your sw.js"));}
if('Notification' in window&&Notification.permission==="default"){Notification.requestPermission();}function loadChats(){
  const listEl=document.getElementById('membersList');
  let fallbackDone=false;
  const doFallback=()=>{
    if(fallbackDone)return;fallbackDone=true;
    if(!isAdmin){
      listEl.innerHTML=`<div class="member-item" data-chatid="${ADMIN_UID+'_'+myId}" data-other="${ADMIN_UID}" style="border:2px solid var(--gold)"><div style="width:48px;height:48px;border-radius:50%;background:#0b1728;border:2px solid var(--gold);display:grid;place-items:center"><img src="masonic-icon.png" style="width:28px"></div><div style="flex:1"><b style="color:var(--gold)">${tr('admin_channel')}</b><br><small style="color:#aaa">${tr('tap_admin')}</small></div><i class="fa fa-chevron-right" style="color:var(--gold)"></i></div>`;
      attachItemEvents();
    }else{
      listEl.innerHTML=`<div style="padding:40px;text-align:center;color:#aaa">${tr('no_members')}<br><small>Members who message appear here</small></div>`;
    }
    setBadge("notifCount",0);setBadge("globalChatBadge",0);updateAppIcon();
  };
  setTimeout(doFallback,1000);
  onValue(ref(db,'chats'),(snap)=>{
    try{
      const raw=snap.val()||{};if(Object.keys(raw).length===0){doFallback();return;}
      let cards=[];let totalUnread=0;let newForMe=null;
      Object.keys(raw).forEach(chatId=>{
        if(!chatId.includes(ADMIN_UID))return;
        const chat=raw[chatId];if(chat.hiddenFor&&chat.hiddenFor[myId])return;
        let other=chatId.replace(ADMIN_UID+'_','').replace('_'+ADMIN_UID,'').trim();
        if(!other||other===ADMIN_UID||other.length<8)return;
        if(!isAdmin&&other!==myId&&!chatId.includes(myId))return;
        const msgs=chat.messages||{};
        // FIX: Ghost 2 messages bug - only visible
        const visibleKeys=Object.keys(msgs).filter(mid=>{const m=msgs[mid];if(!m)return false;if(m.deletedFor&&m.deletedFor[myId])return false;return true;});
        if(visibleKeys.length===0){if(isAdmin&&!chat.lastMessage)return;}
        const lastSeen=isAdmin?(chat.seenByAdmin||0):(chat.seenByMember||0);
        const newInbox=visibleKeys.filter(mid=>{const m=msgs[mid];return m.senderId!==myId&&(m.time||0)>lastSeen;});
        const unread=newInbox.length;
        if(unread>0){
          const latestId=newInbox.sort((a,b)=>(msgs[b].time||0)-(msgs[a].time||0))[0];
          const latest=msgs[latestId];
          if(latest&&latest.senderId!==myId&&Date.now()-latest.time<12000){
            const email=(latest.senderEmail||"").toLowerCase();
            newForMe={msg:latest,other:other,isFromAdmin:(email===ADMIN_EMAIL)};
          }
        }
        const info=chat.info||{};const reg=usersCache[other]||{};
        const name=reg.fullName||info.fullName||'Member '+other.slice(0,5);
        const phone=reg.phone||info.phone||'No phone';const country=reg.country||info.country||'No country';
        let lastMsg=null;
        if(visibleKeys.length>0){visibleKeys.sort((a,b)=>(msgs[b].time||0)-(msgs[a].time||0)).forEach(mid=>{if(!lastMsg)lastMsg=msgs[mid];});}
        if(!lastMsg)lastMsg={text:chat.lastMessage||'',time:chat.lastTime||0,mediaType:'',isGhost:true};
        totalUnread+=unread;
        let preview=lastMsg.mediaType?(lastMsg.mediaType==='video'?'🎥 Video':'📷 Photo'):(lastMsg.text||tr('tap_admin'));
        if(lastMsg.isGhost) preview=tr('tap_admin');
        cards.push({chatId,otherUid:other,name,phone,country,lastText:preview,lastTime:lastMsg.time||chat.lastTime||0,unreadCount:unread,isUnread:unread>0,initials:name.slice(0,2).toUpperCase(),isGhost:!!lastMsg.isGhost});
      });
      if(cards.length===0){doFallback();return;}
      fallbackDone=true;cards.sort((a,b)=>b.lastTime-a.lastTime);
      setBadge("notifCount",totalUnread);setBadge("globalChatBadge",totalUnread);updateAppIcon();
      if(window.LodgeNotifier) window.LodgeNotifier.setAppIconBadge(totalUnread);

      // RESPECT YOUR notification-system.js - USE ITS METHODS
      if(newForMe){
        const txt=newForMe.msg.text||(newForMe.msg.mediaType==='video'?'🎥 Video':'📷 Photo');
        const otherName=usersCache[newForMe.other]?.fullName||"Member";
        if(newForMe.isFromAdmin){
          if(!isAdmin){
            // Member gets message from director - YOUR FILE handles voice + notification
            window.LodgeNotifier?.showPopup("Director",txt,"admin_message");
          }
        }else{
          if(isAdmin){
            // Director gets message from member - YOUR FILE handles voice + notification
            window.LodgeNotifier?.showPopup(otherName,txt,"member_message");
          }
        }
      }

      const realCards=cards.filter(c=>!c.isGhost);
      if(isAdmin&&realCards.length===0){listEl.innerHTML=`<div style="padding:40px;text-align:center;color:#aaa">${tr('no_members')}<br><small>All chats deleted</small></div>`;setBadge("notifCount",0);setBadge("globalChatBadge",0);updateAppIcon();if(window.LodgeNotifier)window.LodgeNotifier.setAppIconBadge(0);return;}
      const displayCards=isAdmin?realCards:cards;
      if(isAdmin){
        let html='';displayCards.forEach(c=>{html+=`<div class="member-item ${c.isUnread?'new-msg':''}" data-chatid="${c.chatId}" data-other="${c.otherUid}"><div style="width:46px;height:46px;border-radius:50%;background:#121D33;border:2px solid ${c.isUnread?'#00ff88':'#D4B16A'};display:grid;place-items:center;color:${c.isUnread?'#00ff88':'#D4B16A'};font-weight:800">${c.initials}</div><div style="flex:1;overflow:hidden;text-align:left"><b style="color:${c.isUnread?'#00ff88':'#D4B16A'}">${c.name}</b><br><small style="color:#D4B16A"><i class="fa fa-phone"></i> ${c.phone} • ${c.country}</small><br><small style="color:${c.isUnread?'#fff':'#aaa'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${c.lastText}</small></div>${c.unreadCount>0?`<div class="badge">${c.unreadCount}</div>`:`<i class="fa fa-chevron-right" style="color:#D4B16A"></i>`}</div>`;});
        listEl.innerHTML=html;
      }else{
        const c=displayCards[0];
        listEl.innerHTML=`<div class="member-item ${c.isUnread?'new-msg':''}" data-chatid="${c.chatId}" data-other="${ADMIN_UID}" style="border:2px solid ${c.isUnread?'#00ff88':'var(--gold)'}"><div style="width:48px;height:48px;border-radius:50%;background:#0b1728;border:2px solid ${c.isUnread?'#00ff88':'var(--gold)'};display:grid;place-items:center"><img src="masonic-icon.png" style="width:28px"></div><div style="flex:1;overflow:hidden"><b style="color:${c.isUnread?'#00ff88':'var(--gold)'}">${tr('admin_channel')}</b><br><small style="color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${c.lastText}</small></div>${c.unreadCount>0?`<div class="badge">${c.unreadCount}</div>`:`<i class="fa fa-shield-alt" style="color:var(--gold)"></i>`}</div>`;
      }
      attachItemEvents();
    }catch(e){doFallback();}
  },()=>{doFallback();});
}
window.openChat=async(otherUid,displayName)=>{
  currentChatId=isAdmin?(ADMIN_UID+"_"+otherUid):(ADMIN_UID+"_"+myId);
  document.getElementById('chatName').innerText=displayName;
  document.getElementById('chatPage').style.display='flex';
  const box=document.getElementById('messages');
  box.innerHTML=`<div style="text-align:center;padding:40px;color:#aaa"><i class="fa fa-spinner fa-spin" style="color:var(--gold)"></i><br><br>Loading messages...</div>`;
  try{if(isAdmin)await update(ref(db,`chats/${currentChatId}`),{seenByAdmin:Date.now()}).catch(()=>{});else await update(ref(db,`chats/${currentChatId}`),{seenByMember:Date.now()}).catch(()=>{});}catch(e){}
  setBadge("notifCount",0);setBadge("globalChatBadge",0);updateAppIcon();if(window.LodgeNotifier)window.LodgeNotifier.setAppIconBadge(0);
  onValue(ref(db,`chats/${currentChatId}/messages`),(snap)=>{
    const data=snap.val();
    let visibleCount=0;
    if(data){Object.keys(data).forEach(mid=>{const m=data[mid];if(!(m.deletedFor&&m.deletedFor[myId]))visibleCount++;});}
    if(!data||visibleCount===0){
      box.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#aaa"><div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(145deg,#121D33,#0b1728);border:2px solid var(--gold);display:grid;place-items:center;margin:0 auto 20px"><i class="fa fa-comments" style="font-size:32px;color:var(--gold)"></i></div><div style="color:var(--gold);font-weight:700;font-size:16px">${tr('no_messages')}</div><div style="font-size:12px;margin-top:8px;color:#666">Start your conversation with ${displayName}<br>Your messages are secured</div><div style="margin-top:20px;color:#333;font-size:11px"><i class="fa fa-lock"></i> End-to-end encrypted</div></div>`;
      return;
    }
    box.innerHTML="";
    Object.keys(data).sort((a,b)=>(data[a].time||0)-(data[b].time||0)).forEach(mid=>{
      const m=data[mid];if(m.deletedFor&&m.deletedFor[myId])return;
      const isMe=m.senderId===myId;if(!isMe&&m.status==='sent'){update(ref(db,`chats/${currentChatId}/messages/${mid}`),{status:'delivered'}).catch(()=>{});}
      if(!isMe&&m.status!=='read'){update(ref(db,`chats/${currentChatId}/messages/${mid}`),{status:'read'}).catch(()=>{});}
      const wrap=document.createElement('div');wrap.className='msg-wrap';wrap.style.justifyContent=isMe?'flex-end':'flex-start';
      const icon=document.createElement('div');icon.className='reply-icon';icon.innerHTML='<i class="fa fa-reply"></i>';
      const div=document.createElement('div');div.className='msg '+(isMe?'my-msg':'other-msg');
      let html='';if(m.replyTo){html+=`<div class="reply-preview"><b style="color:var(--gold)">${m.replyTo.name}</b><br>${m.replyTo.text.slice(0,60)}</div>`;}
      if(m.mediaUrl){if(m.mediaType==='video'){html+=`<div class="media-box"><video src="${m.mediaUrl}" controls style="max-width:260px;border-radius:12px"></video><div class="media-down" onclick="event.stopPropagation();window.downloadUrl('${m.mediaUrl}','video.mp4')"><i class="fa fa-download"></i></div></div>`;}else{html+=`<div class="media-box"><img src="${m.mediaUrl}" style="max-width:260px;border-radius:12px"><div class="media-down" onclick="event.stopPropagation();window.downloadUrl('${m.mediaUrl}','photo.jpg')"><i class="fa fa-download"></i></div></div>`;}}
      let tick='';if(isMe){if(m.status==='read')tick=`<span class="tick tick-read">✓✓</span>`;else if(m.status==='delivered')tick=`<span class="tick tick-delivered">✓✓</span>`;else tick=`<span class="tick tick-sent">✓</span>`;}
      html+=`${m.text||''}<span style="font-size:8px;opacity:.6;float:right;margin-left:6px;margin-top:4px">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>${tick}`;
      div.innerHTML=html;wrap.appendChild(icon);wrap.appendChild(div);box.appendChild(wrap);
      div.addEventListener('contextmenu',e=>{e.preventDefault();showMsgMenu(e,mid,m.text||'Media',isMe,m.mediaUrl||null);});
      let sx=0,cx=0,sw=false,lt=null;
      div.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sw=true;div.classList.add('swiping');lt=setTimeout(()=>{showMsgMenu(e,mid,m.text||'Media',isMe,m.mediaUrl||null);sw=false;},600);},{passive:true});
      div.addEventListener('touchmove',e=>{if(!sw)return;const d=e.touches[0].clientX-sx;if(d>15)clearTimeout(lt);if(d>0&&d<110){cx=d;div.style.transform=`translateX(${cx}px)`;icon.style.opacity=Math.min(cx/60,1);}},{passive:true});
      div.addEventListener('touchend',()=>{clearTimeout(lt);if(!sw)return;sw=false;div.classList.remove('swiping');if(cx>55){setReply(m.text||'📷 Media',isMe?'You':document.getElementById('chatName').innerText);}div.style.transform='translateX(0)';icon.style.opacity='0';cx=0;});
    });
    box.scrollTop=box.scrollHeight;
  },()=>{box.innerHTML=`<div style="padding:40px;text-align:center;color:#ff5a5a">Error loading<br><small>Check Firebase Rules</small></div>`;});
}
function showMsgMenu(e,mid,text,isMine,mediaUrl){selId=mid;selText=text;selIsMine=isMine;selMediaUrl=mediaUrl;const m=document.getElementById('msgMenu');m.style.left=(e.touches?e.touches[0].clientX:e.clientX)-100+'px';m.style.top=(e.touches?e.touches[0].clientY:e.clientY)+'px';m.style.display='flex';document.getElementById('editBtn').style.display=isMine?'flex':'none';document.getElementById('downBtn').style.display=mediaUrl?'flex':'none';}
window.copyMsg=()=>{navigator.clipboard.writeText(selText);hideMenus();showToast('Copied');}
window.editMsg=async()=>{const nt=prompt('Edit:',selText);if(nt){await update(ref(db,`chats/${currentChatId}/messages/${selId}`),{text:nt});showToast('Edited successfully');}hideMenus();}
window.replyMsg=()=>{setReply(selText,selIsMine?'You':document.getElementById('chatName').innerText);hideMenus();}
function setReply(t,n){replyData={text:t,name:n};document.getElementById('replyBar').style.display='flex';document.getElementById('replyToName').innerText=n;document.getElementById('replyToText').innerText=t.slice(0,50);document.getElementById('msgInput').focus();}
window.cancelReply=()=>{replyData=null;document.getElementById('replyBar').style.display='none';}
window.deleteForMe=async()=>{await update(ref(db,`chats/${currentChatId}/messages/${selId}/deletedFor`),{[myId]:true});hideMenus();showToast('Deleted for you');}
window.deleteForEveryone=async()=>{await remove(ref(db,`chats/${currentChatId}/messages/${selId}`));hideMenus();showToast('Deleted successfully');}
window.hideMenus=()=>{document.getElementById('msgMenu').style.display='none';document.getElementById('chatMenu').style.display='none';}
window.deleteChatForMe=async()=>{try{await update(ref(db,`chats/${selChatId||currentChatId}/hiddenFor`),{[myId]:true});hideMenus();showToast('Deleted successfully');if(document.getElementById('chatPage').style.display==='flex')closeChat();}catch(e){hideMenus();}}
window.cancelChatDelete=()=>{hideMenus();showToast('Cancelled');}
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))hideMenus();});
window.downloadUrl=(url,name)=>{const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();showToast('Downloaded');}
window.downloadMedia=()=>{if(selMediaUrl)window.downloadUrl(selMediaUrl,selMediaUrl.includes('.mp4')?'video.mp4':'photo.jpg');hideMenus();}
document.getElementById('mediaInput').addEventListener('change',async(e)=>{
  const file=e.target.files[0];if(!file||!currentChatId)return;
  const box=document.getElementById('messages');const tempId='temp_'+Date.now();const localUrl=URL.createObjectURL(file);const isVideo=file.type.startsWith('video');
  const wrap=document.createElement('div');wrap.id=tempId;wrap.className='msg-wrap';wrap.style.justifyContent='flex-end';wrap.innerHTML=`<div class="msg my-msg"><div class="media-box">${isVideo?`<video src="${localUrl}" style="max-width:260px;border-radius:12px" muted></video>`:`<img src="${localUrl}" style="max-width:260px;border-radius:12px">`}</div><span style="font-size:8px;opacity:.6;float:right">Uploading...</span><span class="tick tick-sent">✓</span></div>`;box.appendChild(wrap);box.scrollTop=box.scrollHeight;
  try{
    let finalUrl='';let mediaType=isVideo?'video':'image';
    if(isVideo){if(file.size>15*1024*1024){showToast('Video max 15MB');document.getElementById(tempId)?.remove();return;}const ext=file.name.split('.').pop()||'mp4';const refS=sRef(storage,`chats/${currentChatId}/${Date.now()}_${myId}.${ext}`);const up=await uploadBytes(refS,file);finalUrl=await getDownloadURL(up.ref);}
    else{finalUrl=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;const MAX=700;if(w>MAX||h>MAX){if(w>h){h=h*(MAX/w);w=MAX;}else{w=w*(MAX/h);h=MAX;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.55));};img.onerror=()=>res(ev.target.result);img.src=ev.target.result;};rd.onerror=rej;rd.readAsDataURL(file);});}
    const payload={senderId:myId,senderEmail:myEmail,text:document.getElementById('msgInput').value.trim(),mediaUrl:finalUrl,mediaType,time:Date.now(),status:'sent'};if(replyData)payload.replyTo=replyData;
    const r=push(ref(db,`chats/${currentChatId}/messages`));await set(r,payload);
    await update(ref(db,`chats/${currentChatId}`),{lastTime:Date.now(),lastMessage:mediaType==='video'?'🎥 Video':'📷 Photo',info:{fullName:myInfo.fullName||'Member',uid:myId},hiddenFor:{}}).catch(()=>{});
    if(isAdmin)await update(ref(db,`chats/${currentChatId}`),{seenByMember:0}).catch(()=>{});else await update(ref(db,`chats/${currentChatId}`),{seenByAdmin:0}).catch(()=>{});
    document.getElementById(tempId)?.remove();document.getElementById('msgInput').value='';cancelReply();
  }catch(err){showToast('Failed: '+err.message);document.getElementById(tempId)?.remove();}
  e.target.value='';
});
window.sendMsg=async()=>{
  const i=document.getElementById('msgInput');const txt=i.value.trim();if(!txt||!currentChatId)return;
  const payload={text:txt,senderId:myId,senderEmail:myEmail,time:Date.now(),status:'sent'};if(replyData)payload.replyTo=replyData;
  const r=push(ref(db,`chats/${currentChatId}/messages`));await set(r,payload);
  await update(ref(db,`chats/${currentChatId}`),{lastTime:Date.now(),lastMessage:txt,info:{fullName:myInfo.fullName||'Member',uid:myId},hiddenFor:{}}).catch(()=>{});
  if(isAdmin)await update(ref(db,`chats/${currentChatId}`),{seenByMember:0}).catch(()=>{});else await update(ref(db,`chats/${currentChatId}`),{seenByAdmin:0}).catch(()=>{});
  i.value="";cancelReply();
}
window.closeChat=()=>{document.getElementById('chatPage').style.display='none';currentChatId=null;}
</script>
</body></html>
