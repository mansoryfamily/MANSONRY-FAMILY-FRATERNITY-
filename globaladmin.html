<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL ADMIN PANEL - Freemasonry Heritage</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#080E1F;--card:#121D33;--border:#1E2E4F;--gold:#D4B16A;--gold2:#F0D185;--muted:#8A9BB5}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--border)}
.top-left{display:flex;align-items:center;gap:12px}
.insta-ring-top{width:44px;height:44px;border-radius:14px;padding:2.5px;background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);display:grid;place-items:center}
.insta-inner-top{width:100%;height:100%;background:#0b1728;border-radius:11px;display:grid;place-items:center;overflow:hidden}
.insta-inner-top img{width:28px;height:28px;object-fit:contain}
.top h1{color:var(--gold);font-size:14px;line-height:1.1;letter-spacing:1px;font-family:Georgia,serif}
.gold-btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer}
#membersList{flex:1;overflow-y:auto;padding-bottom:20px}
.member-item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin:8px 12px;cursor:pointer;transition:.2s}
.member-item:hover{border-color:var(--gold);transform:translateY(-1px)}
.member-item img{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold)}
.member-item b{color:var(--gold);font-size:13px}.member-item span{color:var(--muted);font-size:10px}
.admin-badge{background:var(--gold);color:#000;font-size:8px;padding:2px 6px;border-radius:10px;font-weight:800;margin-left:6px}
#chatPage{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.chat-head{background:var(--card);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px}
#messages{flex:1;overflow-y:auto;padding:16px;background:radial-gradient(circle,#111E36,#080E1F);display:flex;flex-direction:column}
.msg{max-width:78%;padding:9px 13px;border-radius:14px;margin:5px 0;font-size:13.5px;word-break:break-word}
.my-msg{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000;margin-left:auto;border-bottom-right-radius:3px;align-self:flex-end}
.other-msg{background:var(--card);border:1px solid var(--border);margin-right:auto;border-bottom-left-radius:3px;align-self:flex-start}
.input-area{background:var(--card);border-top:1px solid var(--border);padding:8px 10px;display:flex;gap:8px;align-items:center}
.input-area input{flex:1;background:#0A1428;border:1px solid var(--border);color:#fff;padding:11px 15px;border-radius:25px;outline:none;font-size:13px}
.icon-btn{background:var(--gold);color:#000;width:42px;height:42px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer}
</style>
</head><body>

<div class="top">
  <div class="top-left">
    <i class="fa fa-arrow-left" style="color:var(--gold);font-size:18px;cursor:pointer" onclick="location.href='help.html'"></i>
    <div class="insta-ring-top"><div class="insta-inner-top"><img src="masonic-icon.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2091/2091665.png'"></div></div>
    <div><h1 id="panelTitle">GLOBAL ADMIN<br>PANEL</h1><small id="panelSub" style="color:#00ff88;font-size:10px">Checking auth...</small></div>
  </div>
  <button id="adminEmailShow" class="gold-btn" style="background:#0A1428;color:var(--muted);border:1px solid var(--border)">...</button>
</div>

<div style="padding:10px 12px">
  <input id="search" onkeyup="filterM()" placeholder="Search registered members..." style="width:100%;background:#0A1428;border:1px solid #1E2E4F;color:#fff;padding:11px 14px;border-radius:22px;outline:none;font-size:12px;display:none">
  <p id="infoText" style="color:var(--muted);font-size:9px;margin-top:6px;text-align:center;letter-spacing:.5px"></p>
</div>

<div id="membersList"><div style="text-align:center;padding:40px;color:var(--muted)">Loading from Realtime DB...</div></div>

<div id="chatPage">
  <div class="chat-head">
    <i class="fa fa-arrow-left" style="color:var(--gold);font-size:20px;cursor:pointer" onclick="closeChat()"></i>
    <img id="chatImg" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--gold)">
    <div style="flex:1"><h4 id="chatName" style="color:var(--gold);font-size:14px"></h4><small style="color:#00ff88;font-size:10px">● Encrypted • Real-time</small></div>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <input id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMsg()">
    <button class="icon-btn" onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button>
  </div>
</div>

<audio id="snd" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",
  authDomain: "mansonry-family-fraternity.firebaseapp.com",
  databaseURL: "https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mansonry-family-fraternity",
  storageBucket: "mansonry-family-fraternity.firebasestorage.app",
  messagingSenderId: "964415179161",
  appId: "1:964415179161:web:c8fd1a777542932d7c6b08",
  measurementId: "G-Q8LC74ZFXN"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// ✅ ADMIN GMAIL - ONLY THIS EMAIL SEES ALL CONTACTS
const ADMIN_EMAIL = "mansoryfamilyn@gmail.com";

let myId = localStorage.getItem('mansoryId') || 'user_'+Date.now();
localStorage.setItem('mansoryId', myId);
let currentChatId=null;
let isAdmin = false;
let currentUserEmail = "";

onAuthStateChanged(auth, (user)=>{
  if(user){
    myId = user.uid;
    currentUserEmail = user.email || "";
    // ✅ CHECK ADMIN BY GMAIL
    if(currentUserEmail.toLowerCase() === ADMIN_EMAIL.toLowerCase()){
      isAdmin = true;
    }
    document.getElementById('adminEmailShow').innerText = isAdmin? 'ADMIN: '+currentUserEmail : currentUserEmail;
    document.getElementById('adminEmailShow').style.background = isAdmin? 'linear-gradient(180deg,#F0D185,#D4B16A)' : '#0A1428';
    document.getElementById('adminEmailShow').style.color = isAdmin? '#000' : '#8A9BB5';
    loadMembers();
  } else {
    // Not logged in - treat as member, but still show admin contact
    // Optional: redirect to login
    // window.location.href='login.html';
    currentUserEmail = "guest";
    document.getElementById('adminEmailShow').innerText = "Member Mode";
    loadMembers();
  }
});

function updateUI(){
  document.getElementById('panelTitle').innerHTML = isAdmin? 'GLOBAL ADMIN<br>PANEL' : 'ADMIN<br>SUPPORT';
  document.getElementById('panelSub').innerText = isAdmin? '● ADMIN MODE: '+ADMIN_EMAIL : '● Chat with Administration';
  document.getElementById('infoText').innerText = isAdmin? '🔒 ADMIN MODE • YOU SEE ALL CONTACTS • REALTIME DB /members' : '🔒 SECURE • Your messages go directly to mansoryfamilyn@gmail.com';
  document.getElementById('search').style.display = isAdmin? 'block' : 'none';
}

function loadMembers(){
  updateUI();
  onValue(ref(db,'members'), (snap)=>{
    const list=document.getElementById('membersList');
    const data=snap.val()||{};
    list.innerHTML="";
    const allMembers = Object.keys(data).map(k=> ({key:k,...data[k]}));

    // Find admin user - flagged or Gmail matches
    let adminUsers = allMembers.filter(u =>
      u.email && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ||
      u.isAdmin === true ||
      (u.name && (u.name.toUpperCase().includes('ADMIN') || u.name.toUpperCase().includes('DIRECTOR')))
    );

    // Fallback default admin if not in DB
    if(adminUsers.length===0){
      adminUsers = [{key:'ADMIN_DEFAULT', name:'Lodge Director', email:ADMIN_EMAIL, phone:'+254 726 126 580', photo:'', isAdmin:true, uid:'ADMIN_DEFAULT'}];
    }

    if(isAdmin){
      // ✅ ADMIN SEES ALL CONTACTS
      if(allMembers.length===0){
        list.innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--muted)"><p style="color:var(--gold);font-weight:700">ADMIN: ${ADMIN_EMAIL}</p><p style="font-size:12px;margin-top:8px">No members yet in /members</p></div>`;
        return;
      }
      allMembers.forEach(u=>{
        if(u.uid===myId || (u.email && u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase())) return; // don't show self
        list.innerHTML+=`<div class="member-item" onclick="openChat('${u.uid||u.key}','${(u.name||'Member').replace(/'/g,'')}','${u.photo||''}')">
          <img src="${u.photo||'https://ui-avatars.com/api/?name='+encodeURIComponent(u.name||'Member')+'&background=121D33&color=D4B16A'}">
          <div style="flex:1"><b>${u.name||'Member'} ${u.isAdmin?'<span class=admin-badge>ADMIN</span>':''}</b><br><span>${u.phone||''} ${u.email||''} • Tap to chat</span></div>
          <i class="fa fa-chevron-right" style="color:var(--gold);font-size:12px"></i>
        </div>`;
      });
    } else {
      // ✅ MEMBER SEES ONLY ADMIN (mansoryfamilyn@gmail.com)
      adminUsers.forEach(u=>{
        list.innerHTML+=`<div class="member-item" style="border-color:var(--gold);background:linear-gradient(145deg,#1a2a4a,#121D33)" onclick="openChat('${u.uid||u.key}','${(u.name||'Administration').replace(/'/g,'')}','${u.photo||''}')">
          <img src="${u.photo||'https://cdn-icons-png.flaticon.com/512/2091/2091665.png'}">
          <div style="flex:1"><b>${u.name||'Administration'} <span class="admin-badge">ADMIN</span></b><br><span>${u.email||ADMIN_EMAIL} • ${u.phone||'+254 726 126 580'}</span><br><small style="color:#00ff88">● Online • Official Admin</small></div>
          <i class="fa fa-comment-dots" style="color:var(--gold);font-size:18px"></i>
        </div>`;
      });
    }
  });
}

window.openChat=(uid,name,photo)=>{
  currentChatId=[myId,uid].sort().join("_");
  document.getElementById('chatName').innerText=name;
  document.getElementById('chatImg').src=photo||'https://cdn-icons-png.flaticon.com/512/2091/2091665.png';
  document.getElementById('chatPage').style.display='flex';
  onValue(ref(db,`chats/${currentChatId}/messages`), (snap)=>{
    const box=document.getElementById('messages'); box.innerHTML="";
    const data=snap.val()||{};
    Object.keys(data).forEach(mid=>{
      const m=data[mid]; const isMe=m.senderId===myId;
      const div=document.createElement('div'); div.className='msg '+(isMe?'my-msg':'other-msg');
      div.innerHTML=`${m.text}<span style="font-size:9px;opacity:.6;float:right;margin-top:6px;margin-left:8px">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;
      box.appendChild(div);
    });
    box.scrollTop=box.scrollHeight;
    if(Object.keys(data).length>0){
      const last = data[Object.keys(data).pop()];
      if(last.senderId!==myId){ document.getElementById('snd').play().catch(()=>{}); }
    }
  });
}

window.sendMsg=async()=>{
  const i=document.getElementById('msgInput'); const txt=i.value.trim(); if(!txt||!currentChatId) return;
  const r=push(ref(db,`chats/${currentChatId}/messages`)); await set(r,{text:txt,senderId:myId,senderEmail:currentUserEmail,time:Date.now()}); i.value="";
}
window.closeChat=()=>document.getElementById('chatPage').style.display='none';
window.filterM=()=>{ const v=document.getElementById('search').value.toLowerCase(); document.querySelectorAll('.member-item').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(v)?"flex":"none"); }

// Initial load for guests (if not logged in via auth)
setTimeout(()=>{ if(document.getElementById('membersList').innerHTML.includes('Loading')) loadMembers(); }, 2000);
</script>
</body></html>
