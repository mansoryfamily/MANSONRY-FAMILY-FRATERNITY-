<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freemasonry Heritage | Member Directory & Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root{--gold:#d4af37;--gold-dark:#b8941f;--dark:#07111f;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--dark);color:white;min-height:100vh;padding-bottom:120px;}

/* BACKGROUND */
body::before{
content:"";
position:fixed;top:0;left:0;width:100%;height:100%;
background:linear-gradient(rgba(7,17,31,.88), rgba(7,17,31,.95)),url("1517026394531.jpeg");
background-size:cover;background-position:center;background-attachment:fixed;z-index:-2;
}

header{position:fixed;top:0;left:0;width:100%;padding:20px 8%;background:rgba(0,0,0,.8);backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;z-index:1000;border-bottom:1px solid rgba(212,175,55,.2);}
.logo{font-size:28px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;}
.logout{background:var(--gold);color:#111;padding:10px 25px;border-radius:30px;text-decoration:none;font-weight:600;transition:.3s;}

.container{padding:140px 8% 50px;max-width:900px;margin:auto;}
.page-header{text-align:center;margin-bottom:30px;}
.page-header h1{font-size:36px;color:var(--gold);font-family:'Playfair Display',serif;}

/* MEMBER LIST CARDS */
.member-list{display:flex;flex-direction:column;gap:15px;}
.member-card{
background:linear-gradient(145deg,rgba(20,34,56,.9),rgba(11,23,40,.9));
backdrop-filter:blur(20px);
border-radius:16px;
padding:20px;
border:1px solid rgba(212,175,55,.25);
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
transition:.3s;
}
.member-card:hover{transform:translateY(-3px);border-color:var(--gold);}
.member-info{display:flex;align-items:center;gap:15px;}
.avatar{width:50px;height:50px;border-radius:50%;background:rgba(212,175,55,.2);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);font-size:20px;}
.member-details h3{font-size:18px;color:#fff;}
.member-details p{font-size:13px;color:#aaa;}

/* FULL SCREEN CHAT OVERLAY */
.chat-overlay{
position:fixed;top:0;left:0;width:100vw;height:100vh;
background:var(--dark);
z-index:3000;
display:flex;
flex-direction:column;
transform:translateY(100%);
transition:transform .3s ease-in-out;
}
.chat-overlay.active{transform:translateY(0);}

.chat-header{
padding:15px 20px;
background:rgba(0,0,0,.9);
border-bottom:1px solid rgba(212,175,55,.2);
display:flex;
align-items:center;
gap:15px;
}
.back-btn{background:none;border:none;color:var(--gold);font-size:24px;cursor:pointer;}
.chat-title h3{font-size:18px;color:var(--gold);}
.chat-title p{font-size:12px;color:#aaa;}

.chat-body{
flex:1;
padding:20px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:12px;
background:linear-gradient(rgba(7,17,31,.95), rgba(7,17,31,.95)),url("1517026394531.jpeg");
}

.message-bubble{
max-width:80%;
padding:12px 16px;
border-radius:15px;
font-size:14px;
line-height:1.4;
word-wrap:break-word;
position:relative;
user-select:none;
}
.message-bubble.user{
align-self:flex-end;
background:linear-gradient(135deg,var(--gold),var(--gold-dark));
color:#111;
border-bottom-right-radius:2px;
}
.message-bubble.other{
align-self:flex-start;
background:rgba(255,255,255,.1);
color:#fff;
border:1px solid rgba(212,175,55,.3);
border-bottom-left-radius:2px;
}
.time-stamp{font-size:10px;opacity:.7;margin-top:4px;text-align:right;}

.chat-footer{
padding:15px 20px;
background:rgba(0,0,0,.9);
border-top:1px solid rgba(212,175,55,.2);
display:flex;
gap:10px;
align-items:center;
}
.chat-input{
flex:1;
background:rgba(15,26,46,.8);
border:1px solid rgba(212,175,55,.3);
border-radius:25px;
padding:12px 20px;
color:#fff;
font-size:14px;
outline:none;
}
.send-btn{
background:var(--gold);
color:#111;
border:none;
padding:12px 22px;
border-radius:25px;
font-weight:700;
cursor:pointer;
}

/* CONTEXT MENU FOR EDIT/DELETE */
.modal-backdrop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:4000;display:none;align-items:center;justify-content:center;}
.modal-backdrop.active{display:flex;}
.menu-card{background:#142238;border:1px solid var(--gold);border-radius:15px;padding:20px;width:280px;display:flex;flex-direction:column;gap:10px;}
.menu-btn{background:none;border:none;color:#fff;padding:12px;text-align:left;font-size:15px;cursor:pointer;border-radius:8px;}
.menu-btn:hover{background:rgba(212,175,55,.1);color:var(--gold);}
.menu-btn.danger{color:#ff5555;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:rgba(15,26,46,.94);backdrop-filter:blur(25px);padding:10px;border-radius:22px;display:flex;gap:8px;border:1px solid rgba(212,175,55,.25);z-index:2000;max-width:calc(100% - 30px);}
.nav-item{width:90px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#a0b0c9;border-radius:16px;font-size:11px;}
.nav-icon{width:24px;height:24px;margin-bottom:5px;fill:currentColor;}
.nav-item.active{background:linear-gradient(135deg,#d4af37,#b8941f);color:#111;font-weight:600;}
</style>
</head>
<body>

<header>
<div class="logo">Freemasonry Heritage</div>
<a href="#" class="logout">Logout</a>
</header>

<main class="container">
<div class="page-header">
<h1>Fraternity Members</h1>
</div>

<!-- MEMBER LIST CARDS -->
<div class="member-list">
  <div class="member-card" onclick="openChat('director', 'Lodge Director (Stako Nyang\'au)')">
    <div class="member-info">
      <div class="avatar">◬</div>
      <div class="member-details">
        <h3>Lodge Director</h3>
        <p>Tap to open direct chat</p>
      </div>
    </div>
    <span>➔</span>
  </div>

  <div class="member-card" onclick="openChat('support', 'Fraternity Support Line')">
    <div class="member-info">
      <div class="avatar">◬</div>
      <div class="member-details">
        <h3>Helpline Desk</h3>
        <p>Tap to open support chat</p>
      </div>
    </div>
    <span>➔</span>
  </div>
</div>
</main>

<!-- FULL PAGE CHAT OVERLAY -->
<div id="chatOverlay" class="chat-overlay">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">❮</button>
    <div class="chat-title">
      <h3 id="chatRecipientName">Lodge Director</h3>
      <p>Direct Encrypted Channel</p>
    </div>
  </div>
  
  <div class="chat-body" id="chatBody">
    <!-- Messages render here -->
  </div>

  <div class="chat-footer">
    <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." />
    <button id="sendBtn" class="send-btn">Send</button>
  </div>
</div>

<!-- CONTEXT MENU MODAL (FOR HOLD/PRESS ON MESSAGE) -->
<div id="contextModal" class="modal-backdrop" onclick="closeContextMenu()">
  <div class="menu-card" onclick="event.stopPropagation()">
    <button class="menu-btn" onclick="triggerEdit()">✏️ Edit Message</button>
    <button class="menu-btn danger" onclick="triggerDelete()">🗑️ Delete Message</button>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, push, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",
  authDomain: "mansonry-family-fraternity.firebaseapp.com",
  databaseURL: "https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mansonry-family-fraternity",
  storageBucket: "mansonry-family-fraternity.firebasestorage.app",
  messagingSenderId: "964415179161",
  appId: "1:964415179161:web:c8fd1a777542932d7c6b08",
  measurementId: "G-Q8LC74ZFXN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

let currentUser = null;
let activeTargetId = null;
let selectedMsgId = null;
let selectedMsgText = "";
let pressTimer = null;

const chatOverlay = document.getElementById("chatOverlay");
const chatBody = document.getElementById("chatBody");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");
const contextModal = document.getElementById("contextModal");

onAuthStateChanged(auth, (user) => {
  if(!user){ window.location.href = "login.html"; return; }
  currentUser = user;
});

// OPEN & CLOSE FULL-PAGE CHAT
window.openChat = function(targetId, targetName) {
  activeTargetId = targetId;
  document.getElementById("chatRecipientName").innerText = targetName;
  chatOverlay.classList.add("active");
  loadMessages();
};

window.closeChat = function() {
  chatOverlay.classList.remove("active");
};

// LOAD MESSAGES REAL-TIME
function loadMessages() {
  if(!currentUser || !activeTargetId) return;
  const chatRef = ref(database, `chats/${currentUser.uid}_${activeTargetId}`);
  
  onValue(chatRef, (snapshot) => {
    chatBody.innerHTML = "";
    const data = snapshot.val();
    if(data){
      Object.entries(data).forEach(([msgId, msg]) => {
        const isUser = msg.senderId === currentUser.uid;
        const bubble = document.createElement("div");
        bubble.className = `message-bubble ${isUser ? 'user' : 'other'}`;
        
        const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
        bubble.innerHTML = `${msg.text} ${msg.edited ? '<small style="opacity:.6">(edited)</small>' : ''}<div class="time-stamp">${timeStr}</div>`;

        // LONG PRESS / HOLD DETECTION FOR EDIT AND DELETE
        if(isUser){
          bubble.addEventListener("touchstart", () => startPress(msgId, msg.text));
          bubble.addEventListener("touchend", cancelPress);
          bubble.addEventListener("mousedown", () => startPress(msgId, msg.text));
          bubble.addEventListener("mouseup", cancelPress);
        }

        chatBody.appendChild(bubble);
      });
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  });
}

function startPress(id, text) {
  pressTimer = setTimeout(() => {
    selectedMsgId = id;
    selectedMsgText = text;
    contextModal.classList.add("active");
  }, 600);
}

function cancelPress() {
  clearTimeout(pressTimer);
}

window.closeContextMenu = function() {
  contextModal.classList.remove("active");
};

// SEND MESSAGE
sendBtn.addEventListener("click", () => {
  const text = chatInput.value.trim();
  if(!text || !currentUser || !activeTargetId) return;

  const chatRef = ref(database, `chats/${currentUser.uid}_${activeTargetId}`);
  push(chatRef, {
    senderId: currentUser.uid,
    text: text,
    timestamp: serverTimestamp()
  });

  chatInput.value = "";
});

// EDIT MESSAGE
window.triggerEdit = function() {
  closeContextMenu();
  const updatedText = prompt("Edit your message:", selectedMsgText);
  if(updatedText && updatedText !== selectedMsgText){
    const msgRef = ref(database, `chats/${currentUser.uid}_${activeTargetId}/${selectedMsgId}`);
    update(msgRef, {
      text: updatedText,
      edited: true
    });
  }
};

// DELETE MESSAGE
window.triggerDelete = function() {
  closeContextMenu();
  if(confirm("Delete this message?")){
    const msgRef = ref(database, `chats/${currentUser.uid}_${activeTargetId}/${selectedMsgId}`);
    remove(msgRef);
  }
};

document.querySelector(".logout").addEventListener("click",(e)=>{
  e.preventDefault();
  signOut(auth).then(()=>{window.location.href="login.html";});
});
  </script>

</nav>

</body>
</html>
