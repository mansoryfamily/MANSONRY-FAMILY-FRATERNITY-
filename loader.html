<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mansory Family</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#d4af37">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#07111f;height:100vh;height:100dvh;display:flex;justify-content:center;align-items:center;flex-direction:column;overflow:hidden;}
.logo-box{width:115px;height:115px;border-radius:28px;border:3px solid #d4af37;background:#0f1a2e;box-shadow:0 0 35px rgba(212,175,55,.6);animation:pulse 1.6s infinite;z-index:2;display:flex;justify-content:center;align-items:center;padding:10px;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
h1{color:#d4af37;margin-top:28px;font-size:20px;letter-spacing:3px;z-index:2;}
.loader{width:200px;height:4px;background:rgba(212,175,55,.18);border-radius:10px;margin-top:22px;overflow:hidden;z-index:2;}
.loader span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#d4af37,#f1ca52);border-radius:10px;animation:load 6s linear forwards;}
@keyframes load{to{width:100%}}
#statusText{color:#7a8aa0;font-size:11px;margin-top:14px;z-index:2;text-transform:uppercase;}
</style>
</head>
<body>
<div class="logo-box"><img src="./icon-512.png" style="width:100%;height:100%;object-fit:contain;border-radius:18px" onerror="this.src='./images.jpeg'"></div>
<h1>MANSORY FAMILY</h1>
<div class="loader"><span></span></div>
<p id="statusText">Initializing...</p>
<script>
const statusText=document.getElementById('statusText');
const msgs=["Initializing...","Checking brotherhood...","Verifying session...","Loading heritage...","Welcome..."];
let i=0;
const intv=setInterval(()=>{if(i<msgs.length)statusText.textContent=msgs[i++];},1100);
function goNext(){
  clearInterval(intv);
  statusText.textContent="Opening...";
  try{
    const logged=localStorage.getItem("mff_logged_in")==="true" && localStorage.getItem("mff_user");
    if(logged){ location.replace("./dashboard.html"); }
    else{ location.replace("./index.html"); }
  }catch(e){ location.replace("./index.html"); }
}
setTimeout(goNext, 6000);
</script>
</body>
</html>
