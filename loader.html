<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mansory Family</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#d4af37">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  background:#07111f;
  height:100vh;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  overflow:hidden;
}
body::before{
  content:"◬";
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:500px;
  color:rgba(212,175,55,.04);
  animation:spin 25s linear infinite;
  z-index:0;
}
/* LOGO INSIDE SQUARE - FIXED */
.logo-box{
  width:120px;
  height:120px;
  border-radius:30px;
  border:3px solid #d4af37;
  background:#050c18;
  box-shadow:0 0 40px rgba(212,175,55,.6), 0 0 80px rgba(212,175,55,.3);
  animation:pulse 1.5s ease-in-out infinite;
  z-index:2;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
.logo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:27px;
}
@keyframes pulse{
 0%,100%{transform:scale(1);}
 50%{transform:scale(1.08);}
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(360deg);}
}
h1{
  color:#d4af37;
  margin-top:30px;
  font-size:22px;
  letter-spacing:3px;
  text-shadow:0 0 15px rgba(212,175,55,.7);
  z-index:2;
}
.loader{
  width:220px;
  height:4px;
  background:rgba(212,175,55,.2);
  border-radius:10px;
  margin-top:20px;
  overflow:hidden;
  z-index:2;
}
.loader span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#d4af37,#f1ca52);
  border-radius:10px;
  animation:load 5s linear forwards;
  box-shadow:0 0 15px #d4af37;
}
@keyframes load{to{width:100%}}
#statusText{color:#888;font-size:11px;margin-top:12px;letter-spacing:1px;z-index:2}
</style>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: "fd3193e3-77bb-4374-988d-4162b6fb5ab" });
  });
</script>
</head>
<body>

<div class="logo-box">
  <img src="./icon-512.png" alt="logo" onerror="this.src='./images (1).jpeg'">
</div>

<h1>MANSORY FAMILY</h1>
<div class="loader"><span></span></div>
<p id="statusText">Initializing...</p>

<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }

const statusText = document.getElementById('statusText');
const msgs = ["Initializing...","Checking brotherhood...","Verifying session...","Loading heritage...","Welcome..."];
let i = 0;
let intv = setInterval(()=>{
  if(i < msgs.length){ statusText.textContent = msgs[i++]; }
}, 900);

function goNext(){
  clearInterval(intv);
  statusText.textContent = "Opening...";
  try{
    // Check forever login
    const logged = localStorage.getItem("mff_logged_in")==="true";
    const user = localStorage.getItem("mff_user") || localStorage.getItem("mf_profile_cache_");
    
    // IMPORTANT: Use relative path, NOT /  (fixes your 404)
    if(logged){
      window.location.replace("./dashboard.html");
    } else {
      // If you have landing page called landing.html or home.html change here
      // If your landing is also index, then go to login.html
      window.location.replace("./login.html");
    }
  }catch(e){
    window.location.replace("./login.html");
  }
}
setTimeout(goNext, 5000);
</script>

</body>
</html>
