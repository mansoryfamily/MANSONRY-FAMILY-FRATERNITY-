<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mansory Family</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4af37">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<script>
(function(){
  try{
    if(window.location.hostname.includes('github.io')){
      history.replaceState(null,'','/');
    }
  }catch(e){}
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  background:#07111f;
  height:100vh;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  overflow:hidden;
}
body::before{
  content:"◬";
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:500px;
  color:rgba(212,175,55,.04);
  animation:spin 25s linear infinite;
  z-index:0;
}

/* FIXED LOGO SQUARE WITH IMAGE INSIDE */
.logo-box{
  width:120px;
  height:120px;
  border-radius:30px;
  border:3px solid #d4af37;
  background:#050c18;
  box-shadow:0 0 40px rgba(212,175,55,.6), 0 0 80px rgba(212,175,55,.3);
  animation:pulse 1.5s ease-in-out infinite;
  z-index:2;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  padding:8px;
}
.logo-box img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:20px;
}

@keyframes pulse{
 0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(212,175,55,.6);}
 50%{transform:scale(1.08);box-shadow:0 0 60px rgba(212,175,55,.9), 0 0 100px rgba(212,175,55,.5);}
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(360deg);}
}
h1{
  color:#d4af37;
  margin-top:30px;
  font-size:22px;
  letter-spacing:3px;
  text-shadow:0 0 15px rgba(212,175,55,.7);
  animation:fade 2s ease-in-out infinite;
  z-index:2;
}
@keyframes fade{0%,100%{opacity:.7}50%{opacity:1}}
.loader{
  width:220px;
  height:4px;
  background:rgba(212,175,55,.2);
  border-radius:10px;
  margin-top:20px;
  overflow:hidden;
  z-index:2;
}
.loader span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#d4af37,#f1ca52);
  border-radius:10px;
  animation:load 5s linear forwards;
  box-shadow:0 0 15px #d4af37;
}
@keyframes load{to{width:100%}}
#statusText{color:#666;font-size:11px;margin-top:12px;letter-spacing:1px;z-index:2}
</style>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: "fd3193e3-77bb-4374-988d-4162b6fb5ab" });
  });
</script>
</head>
<body>

<!-- FIXED: IMAGE INSIDE SQUARE -->
<div class="logo-box">
  <img src="icon-512.png" alt="logo">
</div>

<h1>MANSORY FAMILY</h1>
<div class="loader"><span id="progressBar"></span></div>
<p id="statusText">Initializing...</p>

<audio id="chime" src="https://cdn.pixabay.com/audio/2022/03/10/audio_4c1d5a8c3d.mp3" preload="auto"></audio>

<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
const statusText = document.getElementById('statusText');
const msgs = ["Initializing...","Checking brotherhood...","Verifying session...","Loading heritage...","Welcome..."];
let msgIndex = 0;
let msgInterval = setInterval(()=>{
  if(msgIndex < msgs.length){
    statusText.textContent = msgs[msgIndex++];
  }
}, 900);
window.addEventListener('load', () => {
  const chime = document.getElementById('chime');
  if(chime){ chime.volume = 0.35; chime.play().catch(()=>{}); }
});
function goNext(){
  clearInterval(msgInterval);
  statusText.textContent = "Opening...";
  try{
    const logged = localStorage.getItem("mff_logged_in")==="true" && localStorage.getItem("mff_user");
    if(logged){
      window.location.replace("dashboard.html");
    } else {
      window.location.replace("index.html");
    }
  }catch(e){
    window.location.replace("index.html");
  }
}
setTimeout(goNext, 5000);
</script>

</body>
</html>
