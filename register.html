<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freemasonry | Member Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#07111f;color:white;min-height:100vh;}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(7,17,31,.85), rgba(7,17,31,.95)),url("1517026394531.jpeg");background-size:cover;z-index:-2;}
header{position:fixed;top:0;left:0;width:100%;padding:20px 8%;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:1000;}
.logo{font-size:30px;font-weight:700;color:#d4af37;}
.hero{text-align:center;padding:120px 10% 40px;}
.hero h1{font-size:55px;color:#d4af37;}
.login-box{max-width:500px;margin:auto;background:rgba(20,34,56,.8);padding:45px;border-radius:20px;border:1px solid rgba(212,175,55,.25);}
.input-group{margin-bottom:20px;}
label{color:#d4af37;margin-bottom:8px;display:block;}
input{width:100%;background:#08111f;border:1px solid #39485f;padding:15px;border-radius:10px;color:white;}
.btn{width:100%;padding:15px;border:none;border-radius:40px;background:linear-gradient(135deg,#d4af37,#b8941f);color:#111;font-weight:bold;cursor:pointer;font-size:16px;}
.btn:disabled{opacity:.6;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,34,56,.98);padding:30px 40px;border-radius:18px;border:2px solid #d4af37;z-index:9999;opacity:0;transition:.4s;text-align:center;min-width:320px;}
.toast.show{opacity:1;}
.toast.error{border-color:#ff5555;} .toast.success{border-color:#4cff88;}
.toast .icon{font-size:45px;margin-bottom:12px;display:block;}

/* MAINTENANCE OVERLAY */
.maintenance-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(7,17,31,.98);z-index:99999;display:none;justify-content:center;align-items:center;flex-direction:column;text-align:center;}
.maintenance-overlay.active{display:flex;}
.maintenance-icon{font-size:80px;color:#d4af37;margin-bottom:20px;cursor:pointer;animation:pulse 2s infinite;}
.maintenance-title{font-size:42px;color:#d4af37;margin-bottom:15px;}
.admin-bypass-box{display:none;background:rgba(20,34,56,.9);padding:25px;border-radius:15px;border:1px solid #d4af37;max-width:400px;width:100%;margin-top:20px;}
.admin-bypass-box.show{display:block;}
.admin-bypass-btn{width:100%;padding:12px;background:linear-gradient(135deg,#d4af37,#b8941f);border:none;border-radius:10px;color:#111;font-weight:bold;cursor:pointer;margin-top:10px;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
</style>
</head>
<body>

<div class="maintenance-overlay" id="maintenanceOverlay">
  <div class="maintenance-icon" id="secretIcon">◬</div>
  <h1 class="maintenance-title">Under Maintenance</h1>
  <p style="color:#ccc;margin-bottom:20px;">Login is currently disabled.</p>
  <div class="admin-bypass-box" id="adminBox">
    <label style="color:#d4af37;">Admin Email</label>
    <input type="email" id="adminBypassEmail" placeholder="Enter admin email" style="width:100%;padding:12px;margin:10px 0;background:#08111f;border:1px solid #39485f;border-radius:10px;color:white;">
    <button class="admin-bypass-btn" id="adminBypassBtn">Unlock Access</button>
  </div>
</div>

<div id="toast" class="toast"><span class="icon" id="toastIcon">✕</span><span class="message" id="toastMessage"></span></div>

<header><div class="logo">Freemasonry Heritage</div></header>

<div class="hero"><h1>Welcome Back</h1><p>Secure access for registered members</p></div>

<section style="padding:0 10% 80px;">
<div class="login-box">
<form id="loginForm">
<div class="input-group"><label>Email Address</label><input id="email" type="email" required></div>
<div class="input-group"><label>Password</label><input id="password" type="password" required></div>
<button class="btn" id="loginBtn" type="submit">Login</button>
</form>
</div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSs3ekiR8vQ_1Ar5oZVBKGjuOQbwcgNEM",
  authDomain: "mansonry-family-fraternity.firebaseapp.com",
  databaseURL: "https://mansonry-family-fraternity-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mansonry-family-fraternity",
  storageBucket: "mansonry-family-fraternity.firebasestorage.app",
  messagingSenderId: "964415179161",
  appId: "1:964415179161:web:c8fd1a777542932d7c6b08"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

const maintenanceOverlay = document.getElementById("maintenanceOverlay");
const secretIcon = document.getElementById("secretIcon");
const adminBox = document.getElementById("adminBox");
const adminBypassBtn = document.getElementById("adminBypassBtn");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const toast = document.getElementById("toast");
const toastMessage = document.getElementById("toastMessage");

const ADMIN_EMAIL = "mansoryfamilyn@gmail.com";
let maintenanceMode = false;
let adminBypassed = false;
let tapCount = 0;

function showToast(type, message){
  toast.className = `toast ${type} show`;
  toastMessage.textContent = message;
  setTimeout(() => {toast.classList.remove('show');}, 3000);
}

// SECRET TAP
secretIcon.addEventListener('click', () => {
  tapCount++;
  setTimeout(() => { tapCount = 0; }, 1000);
  if(tapCount >= 3){
    adminBox.classList.add('show');
    showToast('success','Admin access unlocked');
    tapCount = 0;
  }
});

// ADMIN BYPASS
adminBypassBtn.addEventListener('click', () => {
  if(document.getElementById("adminBypassEmail").value.toLowerCase().trim() === ADMIN_EMAIL){
    adminBypassed = true;
    maintenanceOverlay.classList.remove('active');
  } else {
    showToast('error','Invalid admin email');
  }
});

// LISTEN TO MAINTENANCE
onValue(ref(database, 'settings/maintenance'), (snapshot) => {
  maintenanceMode = snapshot.val() === true;
  if(maintenanceMode && !adminBypassed){
    maintenanceOverlay.classList.add('active');
  } else {
    maintenanceOverlay.classList.remove('active');
  }
});

// LOGIN WITH HARD BLOCK
loginForm.addEventListener("submit", async(e) => {
  e.preventDefault();
  if(maintenanceMode && !adminBypassed){
    showToast('error','Login is currently disabled');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "dashboard.html";
  }
  catch(error){
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
    showToast('error','Login failed: ' + error.message);
  }
});
</script>
</body>
</html>
