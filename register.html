<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<title>Freemasonry | Membership Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-512.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#07111f;
    color:white;
    min-height:100vh;
    padding-bottom:100px;
}

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
        linear-gradient(
            rgba(7,17,31,.85),
            rgba(7,17,31,.95)
        ),
        url("1517026394531.jpeg");
    background-size:cover;
    background-position:center;
    z-index:-2;
}

body::after{
    content:"◬";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:500px;
    color:rgba(212,175,55,.04);
    z-index:-1;
    pointer-events:none;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:20px 8%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#d4af37;
}

.container{
    padding:120px 6% 50px;
    max-width:900px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:36px;
    color:#d4af37;
    margin-bottom:30px;
}

.register-box{
    background:rgba(20,34,56,.85);
    backdrop-filter:blur(20px);
    padding:35px;
    border-radius:20px;
    border:1px solid rgba(212,175,55,.2);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:8px;
    color:#d4af37;
    font-size:14px;
    font-weight:500;
}

input,
select,
textarea{
    background:#08111f;
    border:1px solid #39485f;
    padding:15px;
    border-radius:10px;
    color:white;
    outline:none;
    font-size:15px;
    width:100%;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#d4af37;
}

textarea{
    height:120px;
    resize:none;
}

.full{
    grid-column:1/-1;
}

/* PHONE */

.phone-wrapper{
    display:flex;
    gap:10px;
}

.phone-wrapper select{
    width:48%;
}

.phone-wrapper input{
    width:52%;
}

/* CURRENCY PREVIEW */

.currency-preview{
    grid-column:1/-1;
    display:none;
    padding:16px 20px;
    background:rgba(212,175,55,.08);
    border:1px solid rgba(212,175,55,.25);
    border-radius:12px;
    color:#ddd;
    font-size:14px;
}

.currency-preview strong{
    color:#d4af37;
}

.currency-symbol{
    font-size:20px;
    font-weight:700;
    color:#d4af37;
}

/* PASSWORD */

.password-wrapper{
    position:relative;
}

.password-wrapper input{
    padding-right:50px;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    width:22px;
    height:22px;
    background:#d4af37;
    border:2px solid #d4af37;
    border-radius:4px;
    cursor:pointer;
    transition:.3s;
}

.toggle-password.active{
    background:transparent;
}

/* BUTTON */

.btn{
    margin-top:30px;
    width:100%;
    max-width:300px;
    padding:16px;
    margin-left:auto;
    margin-right:auto;
    display:block;
    border:none;
    border-radius:40px;
    background:linear-gradient(135deg,#d4af37,#b8941f);
    color:#111;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn:disabled{
    opacity:.6;
    transform:none;
    cursor:not-allowed;
}

/* TOAST */

.toast{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.8);
    background:rgba(20,34,56,.98);
    padding:25px 35px;
    border-radius:15px;
    border:2px solid #d4af37;
    z-index:9999;
    opacity:0;
    transition:.4s;
    text-align:center;
    min-width:300px;
    max-width:90%;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

.toast.success{
    border-color:#4cff88;
}

.toast.error{
    border-color:#ff5555;
}

.toast .icon{
    font-size:40px;
    margin-bottom:10px;
    display:block;
}

.toast .message{
    font-size:16px;
    font-weight:600;
    color:#fff;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#d4af37;
    text-decoration:none;
    font-weight:600;
}

/* INSTALL POPUP */

.install-popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.8);
    background:rgba(20,34,56,.98);
    backdrop-filter:blur(20px);
    padding:30px 25px;
    border-radius:20px;
    border:2px solid #d4af37;
    z-index:99999;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:20px;
    width:90%;
    max-width:380px;
    box-shadow:0 20px 60px rgba(212,175,55,.4);
    animation:popupIn .4s forwards;
    text-align:center;
}

@keyframes popupIn{
    to{
        transform:translate(-50%,-50%) scale(1);
    }
}

.install-popup img{
    width:70px;
    height:70px;
    border-radius:18px;
    border:2px solid #d4af37;
}

.install-popup .text h4{
    color:#d4af37;
    margin-bottom:8px;
    font-size:18px;
}

.install-popup .text p{
    color:#ccc;
    font-size:14px;
}

.install-popup .btns{
    display:flex;
    gap:12px;
    width:100%;
}

.install-popup .btn-install{
    flex:1;
    background:linear-gradient(135deg,#d4af37,#b8941f);
    color:#111;
    border:none;
    padding:12px 18px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

.install-popup .btn-close{
    flex:1;
    background:transparent;
    color:#ccc;
    border:1px solid #39485f;
    padding:12px 18px;
    border-radius:25px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

    .title{
        font-size:28px;
    }

    .register-box{
        padding:25px;
    }

    .phone-wrapper{
        flex-direction:column;
    }

    .phone-wrapper select,
    .phone-wrapper input{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- TOAST -->

<div id="toast" class="toast">

    <span class="icon" id="toastIcon"></span>

    <span class="message" id="toastMessage"></span>

</div>


<!-- INSTALL APP POPUP -->

<div class="install-popup" id="installPopup">

    <img src="icon-512.png" alt="logo">

    <div class="text">

        <h4>Install Mansory Family App</h4>

        <p>Add to home screen for faster access</p>

    </div>

    <div class="btns">

        <button
            class="btn-install"
            id="btnInstall">
            Install
        </button>

        <button
            class="btn-close"
            id="btnClose">
            Later
        </button>

    </div>

</div>


<header>

    <div class="logo">
        Freemasonry Heritage
    </div>

</header>


<div class="container">

    <h2 class="title">
        Register Your Interest
    </h2>


    <div class="register-box">

        <form id="registrationForm">

            <div class="form-grid">


                <!-- FULL NAME -->

                <div class="input-group">

                    <label>
                        Full Name *
                    </label>

                    <input
                        id="fullName"
                        type="text"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label>
                        Email Address *
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                </div>


                <!-- COUNTRY -->

                <div class="input-group">

                    <label>
                        Country *
                    </label>

                    <select
                        id="country"
                        required>

                        <option value="">
                            Select Country
                        </option>

                        <option value="Kenya">
                            🇰🇪 Kenya
                        </option>

                        <option value="Uganda">
                            🇺🇬 Uganda
                        </option>

                        <option value="Tanzania">
                            🇹🇿 Tanzania
                        </option>

                        <option value="Rwanda">
                            🇷🇼 Rwanda
                        </option>

                        <option value="DRC">
                            🇨🇩 DRC
                        </option>

                        <option value="South Africa">
                            🇿🇦 South Africa
                        </option>

                        <option value="Nigeria">
                            🇳🇬 Nigeria
                        </option>

                        <option value="Ghana">
                            🇬🇭 Ghana
                        </option>

                        <option value="Ethiopia">
                            🇪🇹 Ethiopia
                        </option>

                        <option value="Zimbabwe">
                            🇿🇼 Zimbabwe
                        </option>

                        <option value="Zambia">
                            🇿🇲 Zambia
                        </option>

                        <option value="Botswana">
                            🇧🇼 Botswana
                        </option>

                        <option value="Namibia">
                            🇳🇦 Namibia
                        </option>

                        <option value="USA">
                            🇺🇸 USA
                        </option>

                        <option value="UK">
                            🇬🇧 UK
                        </option>

                        <option value="Canada">
                            🇨🇦 Canada
                        </option>

                        <option value="Australia">
                            🇦🇺 Australia
                        </option>

                        <option value="India">
                            🇮🇳 India
                        </option>

                    </select>

                </div>


                <!-- PHONE -->

                <div class="input-group">

                    <label>
                        Phone Number *
                    </label>

                    <div class="phone-wrapper">

                        <select
                            id="countryCode"
                            required>

                            <option value="">
                                Code
                            </option>

                            <option value="+254">
                                +254 🇰🇪 Kenya
                            </option>

                            <option value="+256">
                                +256 🇺🇬 Uganda
                            </option>

                            <option value="+255">
                                +255 🇹🇿 Tanzania
                            </option>

                            <option value="+250">
                                +250 🇷🇼 Rwanda
                            </option>

                            <option value="+243">
                                +243 🇨🇩 DRC
                            </option>

                            <option value="+27">
                                +27 🇿🇦 South Africa
                            </option>

                            <option value="+234">
                                +234 🇳🇬 Nigeria
                            </option>

                            <option value="+233">
                                +233 🇬🇭 Ghana
                            </option>

                            <option value="+251">
                                +251 🇪🇹 Ethiopia
                            </option>

                            <option value="+263">
                                +263 🇿🇼 Zimbabwe
                            </option>

                            <option value="+260">
                                +260 🇿🇲 Zambia
                            </option>

                            <option value="+267">
                                +267 🇧🇼 Botswana
                            </option>

                            <option value="+264">
                                +264 🇳🇦 Namibia
                            </option>

                            <option value="+1">
                                +1 🇺🇸 USA / 🇨🇦 Canada
                            </option>

                            <option value="+44">
                                +44 🇬🇧 UK
                            </option>

                            <option value="+61">
                                +61 🇦🇺 Australia
                            </option>

                            <option value="+91">
                                +91 🇮🇳 India
                            </option>

                        </select>


                        <input
                            id="phone"
                            type="tel"
                            inputmode="numeric"
                            placeholder="712345678"
                            autocomplete="tel-national"
                            pattern="[0-9]{7,15}"
                            required>

                    </div>

                </div>


                <!-- CURRENCY PREVIEW -->

                <div
                    class="currency-preview"
                    id="currencyPreview">

                    Your membership currency:

                    <strong id="currencyName">
                        -
                    </strong>

                    <span class="currency-symbol"
                          id="currencySymbol">
                        -
                    </span>

                </div>


                <!-- AGE -->

                <div class="input-group">

                    <label>
                        Age Group *
                    </label>

                    <select
                        id="age"
                        required>

                        <option value="">
                            Select Age
                        </option>

                        <option>
                            18 - 25
                        </option>

                        <option>
                            26 - 40
                        </option>

                        <option>
                            41 - 60
                        </option>

                        <option>
                            60+
                        </option>

                    </select>

                </div>


                <!-- INTEREST -->

                <div class="input-group">

                    <label>
                        Area of Interest *
                    </label>

                    <select
                        id="interest"
                        required>

                        <option value="">
                            Select Interest
                        </option>

                        <option>
                            Brotherhood & Mentorship
                        </option>

                        <option>
                            Community Service
                        </option>

                        <option>
                            Business & Growth
                        </option>

                        <option>
                            Personal Development
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label>
                        Create Password *
                    </label>

                    <div class="password-wrapper">

                        <input
                            id="password"
                            type="password"
                            placeholder="Min 6 characters"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password">
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label>
                        Confirm Password *
                    </label>

                    <div class="password-wrapper">

                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="Re-enter password"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword">
                        </button>

                    </div>

                </div>


                <!-- MESSAGE -->

                <div class="input-group full">

                    <label>
                        Message *
                    </label>

                    <textarea
                        id="message"
                        placeholder="Tell us why you would like to join our brotherhood"
                        required></textarea>

                </div>


            </div>


            <button
                class="btn"
                id="submitBtn"
                type="submit">

                Submit Registration

            </button>


            <div class="login-link">

                <p style="color:#ccc;">

                    Already a member?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </div>

        </form>

    </div>

</div>
